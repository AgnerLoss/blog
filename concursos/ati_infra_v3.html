<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#0d1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>ATI Infra · Concurso Vitória</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0d1117; --surface: #161b27; --card: #1c2438; --border: #2d3a56;
  --accent: #60a5fa; --accent2: #22d3ee; --green: #34d399; --red: #f87171;
  --yellow: #fbbf24; --purple: #a78bfa; --text: #f1f5f9; --muted: #94a3b8;
  --mono: "Space Mono", monospace; --sans: "Syne", sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--sans); overflow-x: hidden; }
#app { display: flex; flex-direction: column; min-height: 100vh; }
.screen { display: none; flex-direction: column; flex: 1; animation: fadeIn .25s ease; }
.screen.active { display: flex; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

/* TOPBAR */
.topbar {
  position: sticky; top: 0; z-index: 99;
  background: rgba(13,17,23,.97); backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  padding: 14px 16px; display: flex; align-items: center; gap: 12px;
}
.topbar .back { background: none; border: none; color: var(--accent); font-size: 22px; cursor: pointer; padding: 4px 8px; }
.topbar h2 { font-weight: 800; font-size: 15px; flex: 1; color: var(--text); }
.topbar .badge { font-family: var(--mono); font-size: 11px; color: var(--accent2); background: var(--border); padding: 3px 10px; border-radius: 20px; }

/* HOME HEADER */
.home-header { padding: 28px 20px 18px; border-bottom: 1px solid var(--border); }
.home-header .label { font-family: var(--mono); font-size: 10px; color: var(--accent2); letter-spacing: .15em; text-transform: uppercase; margin-bottom: 6px; }
.home-header h1 { font-size: 24px; font-weight: 800; line-height: 1.15; }
.home-header h1 span { color: var(--accent); }
.home-header .sub { margin-top: 6px; font-size: 12px; color: var(--muted); }

/* PROGRESS */
.progress-strip { padding: 14px 20px; display: flex; gap: 10px; align-items: center; }
.progress-strip .bar-wrap { flex: 1; height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
.progress-strip .bar-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); transition: width .4s; }
.progress-strip .pct { font-family: var(--mono); font-size: 12px; color: var(--accent2); }

/* SECTION TITLE */
.section-title { font-family: var(--mono); font-size: 10px; color: var(--muted); letter-spacing: .12em; text-transform: uppercase; padding: 14px 20px 8px; }

/* MODE GRID */
.mode-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 0 14px 14px; }
.mode-btn {
  background: #1c2438; border: 1px solid #2d3a56; border-radius: 14px; padding: 16px 13px;
  cursor: pointer; transition: all .18s; display: flex; flex-direction: column; gap: 7px; text-align: left;
}
.mode-btn:active { transform: scale(.96); border-color: var(--accent); }
.mode-btn .icon { font-size: 24px; }
.mode-btn .title { font-size: 14px; font-weight: 800; color: var(--text); }
.mode-btn .desc { font-size: 11px; color: #b0bcd4; line-height: 1.4; }
.mode-btn.full { grid-column: span 2; }
.mode-btn.accent { border-color: var(--accent); background: rgba(96,165,250,.08); }
.mode-btn.purple { border-color: var(--purple); background: rgba(167,139,250,.08); }

/* TOPIC LIST */
.topic-list { padding: 0 14px 80px; display: flex; flex-direction: column; gap: 8px; }
.topic-item {
  background: #1c2438; border: 1px solid #2d3a56; border-radius: 13px; padding: 13px 15px;
  display: flex; align-items: center; gap: 13px; cursor: pointer; transition: all .15s;
}
.topic-item:active { border-color: var(--accent); }
.topic-item .t-icon { font-size: 20px; width: 32px; text-align: center; flex-shrink: 0; }
.topic-item .t-info { flex: 1; min-width: 0; }
.topic-item .t-name { font-size: 14px; font-weight: 700; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.topic-item .t-sub { font-size: 11px; color: #94a3b8; margin-top: 2px; }
.topic-item .t-right { display: flex; align-items: center; gap: 8px; }
.topic-item .t-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.topic-item .t-arrow { color: var(--muted); font-size: 14px; }
.dot-done { background: var(--green); }
.dot-partial { background: var(--yellow); }
.dot-none { background: #2d3a56; }

/* CATEGORY BADGE */
.cat-badge { font-family: var(--mono); font-size: 9px; padding: 2px 7px; border-radius: 10px; flex-shrink: 0; }
.cat-especifico { background: rgba(96,165,250,.15); color: var(--accent); border: 1px solid rgba(96,165,250,.3); }
.cat-basico { background: rgba(34,211,238,.12); color: var(--accent2); border: 1px solid rgba(34,211,238,.25); }
.cat-logica { background: rgba(167,139,250,.15); color: var(--purple); border: 1px solid rgba(167,139,250,.3); }

/* RESUMO */
.resumo-body { padding: 14px; flex: 1; overflow-y: auto; padding-bottom: 30px; }
.resumo-section { margin-bottom: 22px; }
.resumo-section h3 { font-size: 13px; font-weight: 800; color: var(--accent2); margin-bottom: 8px; padding-bottom: 6px; border-bottom: 1px solid var(--border); }
.resumo-section p { font-size: 14px; color: #dde4ef; line-height: 1.7; }
.resumo-section ul { padding-left: 16px; display: flex; flex-direction: column; gap: 5px; }
.resumo-section li { font-size: 14px; color: #dde4ef; line-height: 1.6; }
.resumo-section .highlight { background: rgba(96,165,250,.1); border-left: 3px solid var(--accent); padding: 10px 13px; border-radius: 0 8px 8px 0; margin: 10px 0; font-size: 13px; color: var(--text); font-family: var(--mono); line-height: 1.6; }
.resumo-section .warn { background: rgba(251,191,36,.09); border-left: 3px solid var(--yellow); padding: 10px 13px; border-radius: 0 8px 8px 0; margin: 10px 0; font-size: 13px; color: #f1f5f9; line-height: 1.6; }
.resumo-section .ok { background: rgba(52,211,153,.09); border-left: 3px solid var(--green); padding: 10px 13px; border-radius: 0 8px 8px 0; margin: 10px 0; font-size: 13px; color: #f1f5f9; line-height: 1.6; }

/* TRUTH TABLE */
.truth-table { width: 100%; border-collapse: collapse; font-family: var(--mono); font-size: 13px; margin: 10px 0; border-radius: 10px; overflow: hidden; }
.truth-table th { background: #2d3a56; color: var(--accent2); padding: 8px 6px; text-align: center; font-size: 12px; }
.truth-table td { padding: 7px 6px; text-align: center; border-top: 1px solid #2d3a56; }
.truth-table tr:nth-child(even) td { background: rgba(255,255,255,.03); }
.truth-table .V { color: var(--green); font-weight: 700; }
.truth-table .F { color: var(--red); font-weight: 700; }

/* FLASHCARD */
.fc-wrap { flex: 1; display: flex; flex-direction: column; padding: 14px; gap: 14px; }
.fc-counter { font-family: var(--mono); font-size: 12px; color: var(--muted); text-align: center; }
.fc-prog { height: 3px; background: var(--border); border-radius: 2px; overflow: hidden; }
.fc-prog-fill { height: 100%; background: var(--accent); transition: width .3s; }
.fc-card {
  flex: 1; max-height: 360px; background: #1c2438; border: 1px solid #2d3a56;
  border-radius: 18px; padding: 24px 20px; display: flex; flex-direction: column;
  justify-content: center; align-items: center; text-align: center; gap: 14px;
  cursor: pointer; transition: all .2s; position: relative; overflow: hidden;
}
.fc-card::before { content: ""; position: absolute; inset: 0; background: radial-gradient(circle at 70% 20%, rgba(96,165,250,.05), transparent 60%); }
.fc-card .fc-label { font-family: var(--mono); font-size: 10px; color: var(--accent); letter-spacing: .12em; text-transform: uppercase; }
.fc-card .fc-q { font-size: 16px; font-weight: 700; line-height: 1.45; color: var(--text); }
.fc-card .fc-a { font-size: 13px; color: #b8c8e0; line-height: 1.65; display: none; }
.fc-card.flipped .fc-a { display: block; }
.fc-card.flipped .fc-q { color: var(--accent2); }
.fc-card .fc-tap { font-size: 11px; color: var(--muted); }
.fc-actions { display: flex; gap: 10px; }
.fc-btn { flex: 1; padding: 13px; border-radius: 13px; border: none; cursor: pointer; font-family: var(--sans); font-size: 14px; font-weight: 700; transition: all .15s; }
.fc-btn:active { transform: scale(.96); }
.fc-btn.wrong { background: rgba(248,113,113,.15); color: var(--red); border: 1px solid rgba(248,113,113,.3); }
.fc-btn.right { background: rgba(52,211,153,.15); color: var(--green); border: 1px solid rgba(52,211,153,.3); }
.fc-btn.next { background: var(--accent); color: #0d1117; font-weight: 800; }

/* QUIZ */
.quiz-wrap { flex: 1; padding: 14px; display: flex; flex-direction: column; gap: 13px; padding-bottom: 80px; overflow-y: auto; }
.quiz-q { background: #1c2438; border: 1px solid #2d3a56; border-radius: 14px; padding: 16px; font-size: 15px; font-weight: 600; line-height: 1.55; color: var(--text); }
.quiz-opts { display: flex; flex-direction: column; gap: 9px; }
.quiz-opt {
  background: #1c2438; border: 1px solid #2d3a56; border-radius: 13px; padding: 13px 15px;
  font-size: 14px; color: var(--text); cursor: pointer; transition: all .15s;
  display: flex; gap: 11px; align-items: flex-start;
}
.quiz-opt .opt-letter { font-family: var(--mono); font-size: 11px; color: var(--muted); padding-top: 2px; flex-shrink: 0; font-weight: 700; }
.quiz-opt.correct { background: rgba(52,211,153,.12); border-color: var(--green); color: var(--green); }
.quiz-opt.correct .opt-letter { color: var(--green); }
.quiz-opt.wrong { background: rgba(248,113,113,.1); border-color: var(--red); color: var(--red); }
.quiz-opt.wrong .opt-letter { color: var(--red); }
.quiz-opt.disabled { pointer-events: none; }
.quiz-explain { background: rgba(96,165,250,.08); border: 1px solid rgba(96,165,250,.2); border-radius: 13px; padding: 13px; font-size: 13px; color: #b8c8e0; line-height: 1.65; display: none; }
.quiz-explain.show { display: block; }
.quiz-next { background: var(--accent); color: #0d1117; border: none; border-radius: 13px; padding: 14px; width: 100%; font-family: var(--sans); font-size: 15px; font-weight: 800; cursor: pointer; display: none; margin-top: 2px; }
.quiz-next.show { display: block; }
.quiz-score { text-align: center; padding: 28px 16px; display: flex; flex-direction: column; align-items: center; gap: 13px; }
.score-big { font-size: 58px; font-weight: 800; font-family: var(--mono); }
.score-label { font-size: 15px; color: var(--muted); }
.quiz-restart { background: #1c2438; border: 1px solid #2d3a56; border-radius: 13px; padding: 13px 22px; color: var(--text); font-family: var(--sans); font-size: 14px; font-weight: 700; cursor: pointer; }

/* FILTER TABS */
.filter-tabs { display: flex; gap: 7px; padding: 10px 14px 4px; overflow-x: auto; scrollbar-width: none; }
.filter-tabs::-webkit-scrollbar { display: none; }
.ftab { font-family: var(--mono); font-size: 11px; padding: 5px 12px; border-radius: 20px; border: 1px solid #2d3a56; background: #1c2438; color: var(--muted); cursor: pointer; white-space: nowrap; transition: all .15s; flex-shrink: 0; }
.ftab.active { background: var(--accent); color: #0d1117; border-color: var(--accent); font-weight: 700; }

/* BOTTOM NAV */
.bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: rgba(13,17,23,.97); backdrop-filter: blur(16px);
  border-top: 1px solid var(--border); display: flex;
  padding: 8px 0 env(safe-area-inset-bottom, 8px); z-index: 98;
}
.bottom-nav button {
  flex: 1; background: none; border: none; color: #94a3b8;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  font-size: 10px; font-family: var(--sans); cursor: pointer; padding: 4px 0; transition: color .15s;
}
.bottom-nav button.active { color: var(--accent); }
.bottom-nav button .nb-icon { font-size: 19px; }
.scroll-content { flex: 1; overflow-y: auto; padding-bottom: 60px; }

/* LOGIC INTERACTIVE */
.logic-box { background: #1c2438; border: 1px solid #2d3a56; border-radius: 14px; padding: 16px; margin: 10px 0; }
.logic-box .l-title { font-family: var(--mono); font-size: 11px; color: var(--accent2); margin-bottom: 10px; letter-spacing: .08em; }
.logic-toggles { display: flex; gap: 10px; margin-bottom: 12px; }
.logic-toggle { flex: 1; padding: 10px; border-radius: 10px; border: 2px solid #2d3a56; background: #161b27; font-family: var(--mono); font-size: 14px; font-weight: 700; cursor: pointer; text-align: center; transition: all .2s; }
.logic-toggle.true { border-color: var(--green); color: var(--green); background: rgba(52,211,153,.1); }
.logic-toggle.false { border-color: var(--red); color: var(--red); background: rgba(248,113,113,.1); }
.logic-result { display: flex; flex-direction: column; gap: 6px; }
.logic-row { display: flex; justify-content: space-between; align-items: center; padding: 7px 10px; border-radius: 8px; background: rgba(255,255,255,.03); }
.logic-row .op { font-family: var(--mono); font-size: 13px; color: var(--muted); }
.logic-row .val { font-family: var(--mono); font-size: 14px; font-weight: 700; }
.logic-row .val.V { color: var(--green); }
.logic-row .val.F { color: var(--red); }
</style>
</head>
<body>
<div id="app">

<!-- HOME -->
<div id="screen-home" class="screen active">
  <div class="scroll-content">
    <div class="home-header">
      <div class="label">Concurso Público · Vitória/ES · 2026</div>
      <h1>ATI <span>Infraestrutura</span> &amp; Suporte</h1>
      <div class="sub">5 jul 2026 · 60 questões · 80 pts · Foco no que mais cai</div>
    </div>
    <div class="progress-strip">
      <div class="bar-wrap"><div class="bar-fill" id="global-prog" style="width:0%"></div></div>
      <div class="pct" id="global-pct">0%</div>
    </div>
    <div class="section-title">Modo de estudo</div>
    <div class="mode-grid">
      <button class="mode-btn accent" onclick="showScreen('screen-flash')">
        <div class="icon">🃏</div><div class="title">Flashcards</div><div class="desc">Pergunta &amp; resposta</div>
      </button>
      <button class="mode-btn" onclick="showScreen('screen-quiz')">
        <div class="icon">🎯</div><div class="title">Quiz</div><div class="desc">4 alternativas + gabarito</div>
      </button>
      <button class="mode-btn purple full" onclick="showScreen('screen-logic')">
        <div class="icon">🧠</div><div class="title">Lógica Interativa</div>
        <div class="desc">Tabela verdade, conectivos e "se…então" com simulador ao vivo</div>
      </button>
      <button class="mode-btn full" onclick="showScreen('screen-topics')">
        <div class="icon">📚</div><div class="title">Resumos por tema</div><div class="desc">Todos os blocos do edital</div>
      </button>
    </div>
    <div class="section-title">Blocos do edital</div>
    <div class="topic-list" id="topic-list"></div>
  </div>
  <div class="bottom-nav">
    <button class="active" onclick="showScreen('screen-home')"><span class="nb-icon">🏠</span>Início</button>
    <button onclick="showScreen('screen-flash')"><span class="nb-icon">🃏</span>Cards</button>
    <button onclick="showScreen('screen-quiz')"><span class="nb-icon">🎯</span>Quiz</button>
    <button onclick="showScreen('screen-logic')"><span class="nb-icon">🧠</span>Lógica</button>
    <button onclick="showScreen('screen-topics')"><span class="nb-icon">📚</span>Resumos</button>
  </div>
</div>

<!-- TOPICS LIST -->
<div id="screen-topics" class="screen">
  <div class="topbar">
    <button class="back" onclick="showScreen('screen-home')">←</button>
    <h2>Resumos por Tema</h2>
  </div>
  <div class="scroll-content"><div class="topic-list" id="topics-list-2"></div></div>
</div>

<!-- TOPIC DETAIL -->
<div id="screen-detail" class="screen">
  <div class="topbar">
    <button class="back" id="detail-back">←</button>
    <h2 id="detail-title">Tema</h2>
  </div>
  <div class="resumo-body" id="detail-body"></div>
</div>

<!-- FLASHCARDS -->
<div id="screen-flash" class="screen">
  <div class="topbar">
    <button class="back" onclick="showScreen('screen-home')">←</button>
    <h2>Flashcards</h2>
    <div class="badge" id="fc-topic-badge">Todos</div>
  </div>
  <div class="filter-tabs" id="fc-filter-tabs"></div>
  <div class="fc-wrap">
    <div class="fc-prog"><div class="fc-prog-fill" id="fc-prog-fill" style="width:0%"></div></div>
    <div class="fc-counter" id="fc-counter">1 / 1</div>
    <div class="fc-card" id="fc-card" onclick="flipCard()">
      <div class="fc-label" id="fc-label">tema</div>
      <div class="fc-q" id="fc-q">—</div>
      <div class="fc-a" id="fc-a">—</div>
      <div class="fc-tap" id="fc-tap">toque para revelar</div>
    </div>
    <div class="fc-actions" id="fc-actions-rate" style="display:none">
      <button class="fc-btn wrong" onclick="rateCard(false)">✗ Errei</button>
      <button class="fc-btn right" onclick="rateCard(true)">✓ Acertei</button>
    </div>
    <div class="fc-actions" id="fc-actions-next" style="display:none">
      <button class="fc-btn next" onclick="nextCard()">Próximo →</button>
    </div>
  </div>
</div>

<!-- QUIZ -->
<div id="screen-quiz" class="screen">
  <div class="topbar">
    <button class="back" onclick="showScreen('screen-home')">←</button>
    <h2>Quiz</h2>
    <div class="badge" id="quiz-badge">0/0</div>
  </div>
  <div class="filter-tabs" id="quiz-filter-tabs"></div>
  <div class="quiz-wrap" id="quiz-wrap"></div>
</div>

<!-- LÓGICA INTERATIVA -->
<div id="screen-logic" class="screen">
  <div class="topbar">
    <button class="back" onclick="showScreen('screen-home')">←</button>
    <h2>Lógica Proposicional</h2>
  </div>
  <div class="resumo-body" id="logic-body"></div>
</div>

</div><!-- #app -->
<script>
// ════════════════════════════════════════════════════════
//  TOPICS DATA
// ════════════════════════════════════════════════════════
const TOPICS = [
  // ── LÓGICA (PESO ALTO - 5 questões de raciocínio)
  { id:"logica", icon:"🧠", name:"Raciocínio Lógico", sub:"Conectivos · Tabela Verdade · Silogismo", cat:"logica", resumo:[
    { h:"Proposições", p:"Uma proposição é uma sentença declarativa que pode ser VERDADEIRA ou FALSA (não ambas). Frases interrogativas, exclamativas ou imperativas NÃO são proposições." },
    { h:"Conectivos lógicos", p:"", list:[
      "¬ (NÃO / negação): inverte o valor lógico",
      "∧ (E / conjunção): V só se AMBOS forem V",
      "∨ (OU / disjunção inclusiva): F só se AMBOS forem F",
      "→ (SE…ENTÃO / condicional): F apenas quando p=V e q=F",
      "↔ (SE E SOMENTE SE / bicondicional): V quando p e q têm mesmo valor"
    ]},
    { h:"Condicional — a mais cobrada!", p:"p → q  (se p então q)", code:"p=V, q=V → VERDADEIRO\np=V, q=F → FALSO  ← único caso falso!\np=F, q=V → VERDADEIRO\np=F, q=F → VERDADEIRO\n\nMacete: condicional só é FALSA quando a\nhipótese é verdadeira e a conclusão é falsa." },
    { h:"Negação do condicional", code:"¬(p → q) ≡ p ∧ ¬q\nExemplo:\n'Se chove então leva guarda-chuva'\nNegação: 'Chove E não leva guarda-chuva'" },
    { h:"Contrapositiva (equivalente ao original)", code:"p → q  ≡  ¬q → ¬p\nExemplo:\n'Se é mamífero → tem sangue quente'\nEquivale a: 'Se não tem sangue quente → não é mamífero'" },
    { h:"Leis de De Morgan", code:"¬(p ∧ q) ≡ ¬p ∨ ¬q\n¬(p ∨ q) ≡ ¬p ∧ ¬q\n\nMacete: nega tudo e troca o conectivo (E↔OU)" },
    { h:"Silogismo / Modus Ponens", code:"Se p → q  e  p é verdade\nEntão q é verdade\n\nExemplo:\n'Todo servidor público deve honestidade'\n'João é servidor público'\nConclusão: 'João deve honestidade'" },
    { h:"Para a prova ⚠️", warn:true, p:"Foque em: valor do condicional, negação de proposições compostas, equivalências (contrapositiva), De Morgan. São os temas que mais caem em concursos de TI." }
  ]},

  // ── MATEMÁTICA (PESO ALTO - 10 questões)
  { id:"matematica", icon:"📐", name:"Matemática", sub:"Porcentagem · Regra de 3 · Juros · Geometria", cat:"basico", resumo:[
    { h:"Porcentagem — truques rápidos", p:"", list:[
      "x% de N = (x/100) × N",
      "Aumento de x%: multiplica por (1 + x/100)",
      "Desconto de x%: multiplica por (1 − x/100)",
      "Aumento seguido de desconto NÃO é zero: 10% up + 10% down = −1%"

// ════════════════════════════════════════════════════════
let progress = JSON.parse(localStorage.getItem("ati_v2_prog") || "{}");
function saveProgress() { localStorage.setItem("ati_v2_prog", JSON.stringify(progress)); }

let fcDeck = [], fcIndex = 0, fcCorrect = 0, fcFlipped = false, fcFilter = "all";
let quizDeck = [], quizIndex = 0, quizScore = 0, quizAnswered = false, quizFilter = "all";

const CAT_LABELS = {all:"Todos", especifico:"Específico", basico:"Básicos", logica:"Lógica"};

// ════════════════════════════════════════════════════════
//  NAVIGATION
// ════════════════════════════════════════════════════════
function showScreen(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  if (id === "screen-home") renderHome();
  if (id === "screen-flash") { buildFilterTabs("fc-filter-tabs", fcFilter, setFcFilter); initFlash(); }
  if (id === "screen-quiz")  { buildFilterTabs("quiz-filter-tabs", quizFilter, setQuizFilter); initQuiz(); }
  if (id === "screen-topics") renderTopicsList();
  if (id === "screen-logic") renderLogic();
}

// ════════════════════════════════════════════════════════
//  HOME
// ════════════════════════════════════════════════════════
function renderHome() {
  const total = FLASHCARDS.length;
  const done = Object.values(progress).filter(Boolean).length;
  const pct = Math.round(done / total * 100);
  document.getElementById("global-prog").style.width = pct + "%";
  document.getElementById("global-pct").textContent = pct + "%";

  document.getElementById("topic-list").innerHTML = TOPICS.map(t => topicItemHTML(t, "screen-home")).join("");
}

function topicItemHTML(t, from) {
  const cards = FLASHCARDS.filter(c => c.topic === t.id);
  const done = cards.filter(c => progress["fc_" + t.id + "_" + c.q.slice(0,8)]).length;
  const dc = done === 0 ? "dot-none" : done === cards.length ? "dot-done" : "dot-partial";
  const catClass = {especifico:"cat-especifico", basico:"cat-basico", logica:"cat-logica"}[t.cat] || "cat-basico";
  const catLabel = {especifico:"INFRA", basico:"BÁSICO", logica:"LÓGICA"}[t.cat] || "";
  return `<div class="topic-item" onclick="openTopic('${t.id}','${from}')">
    <div class="t-icon">${t.icon}</div>
    <div class="t-info">
      <div class="t-name">${t.name}</div>
      <div class="t-sub">${t.sub}</div>
    </div>
    <div class="t-right">
      <span class="cat-badge ${catClass}">${catLabel}</span>
      <div class="t-dot ${dc}"></div>
      <div class="t-arrow">›</div>
    </div>
  </div>`;
}

function renderTopicsList() {
  document.getElementById("topics-list-2").innerHTML = TOPICS.map(t => topicItemHTML(t, "screen-topics")).join("");
}

// ════════════════════════════════════════════════════════
//  TOPIC DETAIL
// ════════════════════════════════════════════════════════
function openTopic(id, from) {
  const topic = TOPICS.find(t => t.id === id);
  document.getElementById("detail-title").textContent = topic.name;
  document.getElementById("detail-back").onclick = () => showScreen(from);

  let html = "";
  topic.resumo.forEach(sec => {
    html += `<div class="resumo-section"><h3>${sec.h}</h3>`;
    if (sec.p) {
      const cls = sec.warn ? "warn" : sec.ok ? "ok" : "";
      html += cls ? `<div class="${cls}">${sec.p}</div>` : `<p>${sec.p}</p>`;
    }
    if (sec.list) html += `<ul>${sec.list.map(l => `<li>${l}</li>`).join("")}</ul>`;
    if (sec.code) html += `<div class="highlight">${sec.code.replace(/\n/g,"<br>")}</div>`;
    html += "</div>";
  });

  document.getElementById("detail-body").innerHTML = html;
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.getElementById("screen-detail").classList.add("active");
}

// ════════════════════════════════════════════════════════
//  FILTER TABS
// ════════════════════════════════════════════════════════
function buildFilterTabs(containerId, activeFilter, setFn) {
  const cats = ["all", ...new Set(TOPICS.map(t => t.cat))];
  document.getElementById(containerId).innerHTML = cats.map(c =>
    `<div class="ftab${activeFilter===c?" active":""}" onclick="${setFn.name}('${c}')">${CAT_LABELS[c]||c}</div>`
  ).join("");
}

function setFcFilter(cat) { fcFilter = cat; buildFilterTabs("fc-filter-tabs", fcFilter, setFcFilter); initFlash(); }
function setQuizFilter(cat) { quizFilter = cat; buildFilterTabs("quiz-filter-tabs", quizFilter, setQuizFilter); initQuiz(); }

function getFilteredCards() {
  if (fcFilter === "all") return [...FLASHCARDS];
  const ids = TOPICS.filter(t => t.cat === fcFilter).map(t => t.id);
  return FLASHCARDS.filter(c => ids.includes(c.topic));
}
function getFilteredQuiz() {
  if (quizFilter === "all") return [...QUIZ];
  const ids = TOPICS.filter(t => t.cat === quizFilter).map(t => t.id);
  return QUIZ.filter(q => ids.includes(q.topic));
}

// ════════════════════════════════════════════════════════
//  FLASHCARDS
// ════════════════════════════════════════════════════════
function initFlash() {
  fcDeck = getFilteredCards().sort(() => Math.random() - .5);
  fcIndex = 0; fcCorrect = 0; fcFlipped = false;
  renderCard();
}

function renderCard() {
  const card_el = document.getElementById("fc-card");
  if (fcIndex >= fcDeck.length) {
    card_el.innerHTML = `<div class="fc-label">CONCLUÍDO 🎉</div>
      <div class="fc-q">${fcCorrect}/${fcDeck.length} acertos (${Math.round(fcCorrect/fcDeck.length*100)}%)</div>
      <div class="fc-tap" style="color:var(--accent);margin-top:16px" onclick="initFlash()">↺ Embaralhar de novo</div>`;
    document.getElementById("fc-actions-rate").style.display = "none";
    document.getElementById("fc-actions-next").style.display = "none";
    return;
  }
  const card = fcDeck[fcIndex];
  const topic = TOPICS.find(t => t.id === card.topic);
  document.getElementById("fc-label").textContent = topic ? topic.icon + " " + topic.name : card.topic;
  document.getElementById("fc-q").textContent = card.q;
  document.getElementById("fc-a").textContent = card.a;
  document.getElementById("fc-a").style.display = "none";
  card_el.classList.remove("flipped");
  document.getElementById("fc-tap").style.display = "block";
  document.getElementById("fc-counter").textContent = `${fcIndex+1} / ${fcDeck.length}`;
  document.getElementById("fc-prog-fill").style.width = (fcIndex/fcDeck.length*100) + "%";
  document.getElementById("fc-topic-badge").textContent = (topic ? topic.icon : "") + " " + (fcIndex+1) + "/" + fcDeck.length;
  document.getElementById("fc-actions-rate").style.display = "none";
  document.getElementById("fc-actions-next").style.display = "none";
  fcFlipped = false;
}

function flipCard() {
  if (fcFlipped) return;
  fcFlipped = true;
  document.getElementById("fc-card").classList.add("flipped");
  document.getElementById("fc-a").style.display = "block";
  document.getElementById("fc-tap").style.display = "none";
  document.getElementById("fc-actions-rate").style.display = "flex";
}

function rateCard(correct) {
  const card = fcDeck[fcIndex];
  progress["fc_" + card.topic + "_" + card.q.slice(0,8)] = correct;
  saveProgress();
  if (correct) fcCorrect++;
  fcIndex++;
  renderCard();
}
function nextCard() { fcIndex++; renderCard(); }

// ════════════════════════════════════════════════════════
//  QUIZ
// ════════════════════════════════════════════════════════
function initQuiz() {
  quizDeck = getFilteredQuiz().sort(() => Math.random() - .5);
  quizIndex = 0; quizScore = 0; quizAnswered = false;
  renderQuizQuestion();
}

function renderQuizQuestion() {
  const wrap = document.getElementById("quiz-wrap");
  if (quizIndex >= quizDeck.length) {
    const pct = Math.round(quizScore/quizDeck.length*100);
    const color = pct>=70?"var(--green)":pct>=50?"var(--yellow)":"var(--red)";
    const msg = pct>=70?"🎉 Ótimo!":pct>=50?"📚 Continue estudando!":"💪 Revise os resumos!";
    wrap.innerHTML = `<div class="quiz-score">
      <div class="score-big" style="color:${color}">${pct}%</div>
      <div class="score-label">${quizScore} de ${quizDeck.length} corretas</div>
      <div class="score-label">${msg}</div>
      <button class="quiz-restart" onclick="initQuiz()">↺ Novo quiz</button>
    </div>`;
    document.getElementById("quiz-badge").textContent = quizScore+"/"+quizDeck.length;
    return;
  }
  const q = quizDeck[quizIndex];
  const topic = TOPICS.find(t => t.id === q.topic);
  document.getElementById("quiz-badge").textContent = (quizIndex+1)+"/"+quizDeck.length;
  quizAnswered = false;
  wrap.innerHTML = `
    <div style="font-family:var(--mono);font-size:10px;color:var(--muted);margin-bottom:4px">${topic?topic.icon+" "+topic.name:""}</div>
    <div class="quiz-q">${q.q}</div>
    <div class="quiz-opts">${q.opts.map((o,i)=>`
      <div class="quiz-opt" id="opt-${i}" onclick="answerQuiz(${i})">
        <span class="opt-letter">${"ABCD"[i]}</span><span>${o}</span>
      </div>`).join("")}
    </div>
    <div class="quiz-explain" id="quiz-explain">${q.explain}</div>
    <button class="quiz-next" id="quiz-next" onclick="nextQuizQ()">Próxima →</button>`;
}

function answerQuiz(idx) {
  if (quizAnswered) return;
  quizAnswered = true;
  const q = quizDeck[quizIndex];
  document.querySelectorAll(".quiz-opt").forEach((o,i) => {
    o.classList.add("disabled");
    if (i === q.correct) o.classList.add("correct");
    else if (i === idx) o.classList.add("wrong");
  });
  if (idx === q.correct) quizScore++;
  document.getElementById("quiz-explain").classList.add("show");
  document.getElementById("quiz-next").classList.add("show");
}
function nextQuizQ() { quizIndex++; renderQuizQuestion(); }

// ════════════════════════════════════════════════════════
//  LÓGICA INTERATIVA
// ════════════════════════════════════════════════════════
let lP = true, lQ = true;

function renderLogic() {
  const body = document.getElementById("logic-body");
  body.innerHTML = `
  <div class="resumo-section">
    <h3>🎮 Simulador ao vivo — escolha os valores de P e Q</h3>
    <div class="logic-box">
      <div class="l-title">VALORES DAS PROPOSIÇÕES</div>
      <div class="logic-toggles">
        <button class="logic-toggle ${lP?"true":"false"}" id="btn-p" onclick="toggleLogic('p')">P = ${lP?"V":"F"}</button>
        <button class="logic-toggle ${lQ?"true":"false"}" id="btn-q" onclick="toggleLogic('q')">Q = ${lQ?"V":"F"}</button>
      </div>
      <div class="logic-result" id="logic-results"></div>
    </div>
  </div>

  <div class="resumo-section">
    <h3>📊 Tabela Verdade Completa</h3>
    <table class="truth-table">
      <tr><th>P</th><th>Q</th><th>¬P</th><th>P∧Q</th><th>P∨Q</th><th>P→Q</th><th>P↔Q</th></tr>
      ${[
        [true,true],[true,false],[false,true],[false,false]
      ].map(([p,q])=>{
        const np=!p,and=p&&q,or=p||q,imp=!p||q,bic=p===q;
        const v=x=>`<span class="${x?"V":"F"}">${x?"V":"F"}</span>`;
        return `<tr><td>${v(p)}</td><td>${v(q)}</td><td>${v(np)}</td><td>${v(and)}</td><td>${v(or)}</td><td>${v(imp)}</td><td>${v(bic)}</td></tr>`;
      }).join("")}
    </table>
  </div>

  <div class="resumo-section">
    <h3>💡 Conectivos — resumo visual</h3>
    <div class="logic-box">
      <div class="l-title">QUANDO CADA UM É FALSO?</div>
      <div class="logic-result">
        <div class="logic-row"><span class="op">¬P (NÃO)</span><span style="font-size:12px;color:#b8c8e0">Inverte: V→F, F→V</span></div>
        <div class="logic-row"><span class="op">P ∧ Q (E)</span><span style="font-size:12px;color:#b8c8e0">F quando qualquer um for F</span></div>
        <div class="logic-row"><span class="op">P ∨ Q (OU)</span><span style="font-size:12px;color:#b8c8e0">F só quando AMBOS forem F</span></div>
        <div class="logic-row"><span class="op">P → Q (SE…ENTÃO)</span><span style="font-size:12px;color:var(--red)">F só quando P=V e Q=F ⚠️</span></div>
        <div class="logic-row"><span class="op">P ↔ Q (SSE)</span><span style="font-size:12px;color:#b8c8e0">F quando P e Q diferentes</span></div>
      </div>
    </div>
  </div>

  <div class="resumo-section">
    <h3>🔄 Equivalências importantes</h3>
    <div class="highlight">p → q  ≡  ¬p ∨ q  ≡  ¬q → ¬p (contrapositiva)</div>
    <div class="highlight">¬(p → q)  ≡  p ∧ ¬q  (negação do condicional)</div>
    <div class="highlight">¬(p ∧ q)  ≡  ¬p ∨ ¬q  (De Morgan 1)</div>
    <div class="highlight">¬(p ∨ q)  ≡  ¬p ∧ ¬q  (De Morgan 2)</div>
  </div>

  <div class="resumo-section">
    <h3>✍️ Exemplos do tipo concurso</h3>
    <div class="warn">⚠️ "Se o candidato estuda (P), então é aprovado (Q)"<br><br>
    Quando é FALSA? Quando estuda E não é aprovado (P=V, Q=F).<br><br>
    Contrapositiva (equivalente): "Se não foi aprovado, então não estudou"<br>
    Recíproca (NÃO equivalente): "Se foi aprovado, então estudou"<br>
    Negação: "Estuda E não é aprovado"</div>
  </div>`;

  updateLogicResults();
}

function toggleLogic(v) {
  if (v==="p") lP=!lP; else lQ=!lQ;
  document.getElementById("btn-p").className = `logic-toggle ${lP?"true":"false"}`;
  document.getElementById("btn-p").textContent = `P = ${lP?"V":"F"}`;
  document.getElementById("btn-q").className = `logic-toggle ${lQ?"true":"false"}`;
  document.getElementById("btn-q").textContent = `Q = ${lQ?"V":"F"}`;
  updateLogicResults();
}

function updateLogicResults() {
  const el = document.getElementById("logic-results");
  if (!el) return;
  const p=lP, q=lQ;
  const ops = [
    ["¬P", !p], ["¬Q", !q],
    ["P ∧ Q (E)", p&&q],
    ["P ∨ Q (OU)", p||q],
    ["P → Q (SE…ENTÃO)", !p||q],
    ["P ↔ Q (SE E SOMENTE SE)", p===q]
  ];
  el.innerHTML = ops.map(([label,val]) =>
    `<div class="logic-row">
      <span class="op">${label}</span>
      <span class="val ${val?"V":"F"}">${val?"VERDADEIRO":"FALSO"}</span>
    </div>`
  ).join("");
}

// ════════════════════════════════════════════════════════
//  INIT
// ════════════════════════════════════════════════════════
renderHome();
</script>
