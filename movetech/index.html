        title: "Laboratório 01 — Git & GitHub: Fundamentos de Versionamento",
        content:
          "Laboratório prático de Git e GitHub, com foco em fluxo profissional: branch, commit, push, Pull Request e troubleshooting dos erros mais comuns do dia a dia.\n\nMISSÃO 1 — PREPARANDO O AMBIENTE\ngit config já estava configurado de uso anterior (user.name, user.email), incluindo credential.helper via gh auth git-credential — autenticação moderna via GitHub CLI em vez de token salvo em texto puro.\n\nMISSÃO 2 — INICIALIZAR O GIT\ngit init criado com branch padrão 'master'. Ajustado na hora com git branch -m main + git config --global init.defaultBranch main, evitando incompatibilidade futura com o git push -u origin main da Missão 5.\n\nMISSÃO 3 — PRIMEIRO COMMIT\nErro real capturado na prática: tentativa de commit sem o README.md existir ainda — 'nothing to commit, working tree clean' apesar do commit não ter sido feito. Corrigido criando o arquivo antes do add. Commit inicial registrado (595ad08).\n\nMISSÃO 4 — CRIANDO BRANCH\nfeature/cadastro criada e validada com git branch.\n\nMISSÃO 5 — PUSH\nRepositório movetech-lab-git criado vazio no GitHub. git remote add origin + git push -u origin main publicou a branch principal sem pedir autenticação manual (graças ao credential.helper já configurado).\n\nMISSÃO 6 — PULL REQUEST\nPR #1 aberto a partir da feature/cadastro. GitGuardian Security Checks rodou automaticamente no PR ('No secrets detected') — app de segurança que já vinha ativo na conta, escaneando todo PR em busca de credenciais vazadas. Merge feito direto pela interface do GitHub.\n\nMISSÃO 7 — HISTÓRICO\ngit log, git status e git diff. Descoberta prática: git log e git branch abrem um pager por padrão (mostra '(END)' até apertar 'q') — usar git --no-pager log ou git log --oneline evita esse comportamento ao copiar output.\n\nMISSÃO 8 — CORREÇÃO DE ERROS\nNão precisou simular os erros do guia artificialmente — já tinham acontecido de verdade nas missões anteriores (nothing to commit, fast-forward em pull).\n\nMISSÃO 9 — DESAFIO SEM CONSULTA\nCriada branch feature/cadastro-v2 (nome novo, já que feature/cadastro tinha sido mergeada e apagada da lógica do desafio). Dois erros reais cometidos e autodiagnosticados sem ajuda:\n1. git push antes de existir a branch remota — 'src refspec does not match any'. Corrigido criando a branch local com checkout -b antes do push.\n2. Segundo commit sem git add antes — 'Changes not staged for commit'. Corrigido adicionando o passo que faltava.\n3 commits registrados (827c6dc, 0381153, 2959b48), push da branch, PR #2 aberto e mergeado (3 commits, squash em 9f07a85), git log --oneline final mostrando a árvore completa do repositório desde o commit inicial.\n\nCONCEITOS CONSOLIDADOS\nBranch padrão do Git mudou de master para main na comunidade — mas o Git ainda usa master por default até configurar init.defaultBranch globalmente.\nPager do terminal (less) intercepta output de comandos como log e branch por padrão — comportamento normal, não é erro, só precisa saber sair com 'q' ou usar --no-pager.\nsrc refspec does not match any: erro clássico de tentar dar push de uma branch que só existe localmente sem ter sido criada — resolvido com checkout -b antes.\ngit add é obrigatório antes de cada commit, mesmo que já tenha commitado a mesma branch antes — stage não é automático.\nFluxo profissional real: branch → commits pequenos e descritivos → push → Pull Request → checks automáticos (GitGuardian) → merge — nunca commit direto na main.\nSegurança automatizada: GitGuardian (ou similar) rodando em todo PR é uma camada extra de proteção contra vazamento de credenciais, complementar à disciplina manual de nunca commitar segredo.",
        tags: ["git", "github", "versionamento", "branch", "pull request", "commit", "troubleshooting", "credenciais", "gitguardian", "movetech"],
      },

        title: "Laboratório Investigativo 01 — Integração de Serviços: Metodologia E.O.I.A. na Prática",
        content:
          "Laboratório Investigativo postado pelo professor Gilmar Jesus no Classroom, com o objetivo de treinar raciocínio investigativo em falhas de integração — metodologia E.O.I.A. (Execute → Observe → Investigue → Analise → Explique), não só rodar comando por rodar.\n\nARQUITETURA DO LABORATÓRIO\nCliente → Service A (orquestrador, FastAPI, porta 8001) → Service B (processamento, porta 8002) → Service C (integração externa, porta 8003) → APIs públicas (clima via Open-Meteo, cotação via exchangerate.host)\nStack: Docker Compose, 3 serviços Python/FastAPI/Uvicorn, rede bridge própria (integration-lab_default, subnet 100.65.1.0/24).\n\nMISSÃO 1 — INICIALIZANDO O AMBIENTE\ndocker compose up --build: 3/3 containers up, build limpo em ~16s cada imagem. Nenhum container reiniciando.\nOrdem de start não seguiu a hierarquia lógica A→B→C (subiu B, depois C, depois A) — esperado, já que o docker-compose.yml não tem depends_on definido.\n\nMISSÃO 2 — EXPLORANDO PELO HOST\ncurl direto em cada porta (8001/8002/8003) revelou dois achados:\n1. API de cotação (exchangerate.host) exige API key agora mesmo no plano grátis — retornou 'missing_access_key'. Falha real de dependência externa, contrato da API mudou.\n2. Service B respondeu só {status:ok}, sem nenhum campo downstream — primeiro sinal de que B nunca aciona C.\n\nMISSÃO 3 — FLUXO COMPLETO\nscripts/call_flow.sh (A→B) funcionou, mas confirmado via contagem de linhas de log: Service B foi de 2 para 3 chamadas depois do fluxo completo, Service C continuou com 1 chamada só (a do curl manual da Missão 2). Prova definitiva: o fluxo real da aplicação é só A→B — o C fica isolado, nunca é chamado pela cadeia, apesar da arquitetura no papel dizer A→B→C. Causa raiz: o código do service-b nunca usa a variável SERVICE_C_URL, que existe no docker-compose.yml mas não é lida em lugar nenhum do main.py.\n\nMISSÃO 4 — COMUNICAÇÃO INTERNA ENTRE CONTAINERS\ndocker network inspect confirmou a topologia: subnet 100.65.1.0/24, IPs de cada container batendo exatamente com os IPs de origem já vistos nos logs anteriores.\ndocker compose exec service-b curl http://service-c:8000/process funcionou perfeitamente — prova que a rede NÃO é o problema. service-b alcança service-c sem dificuldade quando chamado manualmente; a causa é 100% de código, não de infraestrutura.\nDNS interno do Compose: cada serviço vira nome resolvível dentro da rede — localhost dentro de um container aponta só pro próprio container, nunca pra outro.\n\nMISSÃO 5 — FALHA POR SERVIÇO INDISPONÍVEL\ndocker compose stop service-b + rodar o fluxo completo → Service A quebrou com 500 e traceback completo: NameResolutionError, 'Failed to resolve service-b (Temporary failure in name resolution)'.\nDescoberta importante: parar um container não só derruba a porta — o nome do serviço literalmente some do DNS interno do Compose. Causa raiz classificada como falha de dependência, manifestada na camada de rede (DNS).\nObservação de código: service-a não tem nenhum try/except ao chamar service-b (diferente do service-c, que protege cada chamada externa) — por isso quebra com 500 feio em vez de responder algo degradado.\ndocker compose ps sem -a esconde containers parados — usar docker compose ps -a pra ver o quadro completo.\n\nMISSÃO 6 — RESTAURANDO E COMPARANDO RESILIÊNCIA\ndocker compose start service-b: recuperação automática confirmada — o DNS interno se autocorrige assim que o container volta, sem reiniciar o service-a.\nBUG NO MATERIAL OFICIAL encontrado: scripts/call_flow_resilient.sh usa 'source ./common.sh' — caminho relativo à pasta de onde o script é chamado, não à pasta onde ele mora. Como o guia manda rodar tudo da raiz do projeto (bash scripts/call_flow_resilient.sh), o source sempre falha lá, e a cascata de erros consequente ('call_api: comando não encontrado', 'info: menu não encontrado') é o bash tentando interpretar builtins/comandos de sistema no lugar das funções que nunca foram carregadas. Contornado sem alterar código: rodando de dentro da própria pasta scripts/ (cd scripts && bash call_flow_resilient.sh), o source ./common.sh encontra o arquivo e o script roda normal.\nExecução bem-sucedida: log estruturado com timestamp, nível (INFO) e trace_id único gerado por execução — sucesso na tentativa 1.\nComparação cliente simples vs resiliente: o simples (call_flow.sh) só falha ou funciona, sem rastreabilidade. O resiliente adiciona trace_id (rastreio de requisição em sistema distribuído), retry com espera fixa de 2s, e log estruturado por nível.\n\nCONCEITOS CONSOLIDADOS\nMetodologia E.O.I.A.: Execute, Observe, Investigue, Analise, Explique — evidência de log > suposição.\nDNS interno do Docker Compose: nomes de serviço só resolvem enquanto o container está rodando; parar (stop) derruba a resolução de nome, não só a porta.\nCausa raiz por camada: sempre isolar se a falha é de rede (conectividade), aplicação (código) ou dependência externa (API terceira) — o mesmo sintoma (erro 500) pode vir de qualquer uma das três.\nRetry simples resolve falha temporária, não permanente — e retries simultâneos sem backoff exponencial + jitter podem causar 'retry storm' e piorar a recuperação de um serviço sob carga em produção.\nTrace ID: identificador único por requisição, essencial pra seguir uma chamada através de múltiplos serviços em logs agregados — sem ele, correlacionar uma falha entre A, B e C exigiria comparar timestamps na mão.\nBug em material didático também é aprendizado válido: script com path relativo quebrado (source ./common.sh) é o mesmo tipo de armadilha que comandos mgc desatualizados no Módulo 5 — sempre validar na prática, não assumir que o guia funciona 100% como escrito.\nGap de integração real identificado no próprio código: variável de ambiente declarada (SERVICE_C_URL) mas nunca lida — lembrete de que configuração presente no compose não garante que o código a utiliza; sempre validar.",
        tags: ["docker", "docker compose", "fastapi", "integração de serviços", "dns", "resiliência", "retry", "trace id", "troubleshooting", "eoia", "rede", "microsserviços", "movetech"],

        title: "Módulo 5 — Redes: VPC, Subnets, Security Groups e Lab de Conectividade",
        content:
          "Aula do Módulo 5 — Redes em Cloud na Magalu Cloud. Sessão intensa com muita descoberta de CLI na raça, prova de fundamentos e lab completo de conectividade.\n\nPROVA — FUNDAMENTOS DE SISTEMAS E INFRAESTRUTURA\n25/30 sem consulta — cenários reais de troubleshooting, permissões, storage, containers e arquitetura cloud. Feedback do professor Gilmar: 'Parabéns, seu conhecimento é muito bom.'\n\nDESCOBERTAS DE CLI — COMANDOS CORRETOS\nO lab original usava comandos inexistentes no mgc atual. Descobrimos na raça:\nmgc network subnets create → NÃO EXISTE\nComando correto: mgc network vpcs subnets create (subnets ficam dentro do contexto da VPC)\nmgc network vpcs create → NÃO aceita --cidr (CIDR vai nas subnets, não na VPC)\nmgc network security-groups rules create → usa --port-range-min e --port-range-max (não --port)\nmgc network security-groups delete → usa --security-group-id (não --id)\nmgc network subnetpools delete → usa --subnetpool-id (não --id)\nProtocolo nas regras: aceita apenas icmp, icmpv6, tcp, udp (não aceita 'any')\nImagem Ubuntu: nome correto é 'cloud-ubuntu-24.04 LTS' (não 'ubuntu')\nVM falha com 'VPC without subnet ipv4' se criada antes da subnet existir\nVPC fica em status 'processing' por alguns minutos — aguardar 'created' antes de criar VMs\n\nLABORATÓRIO — ARQUITETURA DE REDE\nVPC criada: lab-vpc-agner\nSubnets criadas via mgc network vpcs subnets create:\nsubnet-publica → 172.18.100.0/24 (zona br-se1-a)\nsubnet-privada → 172.18.101.0/24 (zona br-se1-a)\nNota: Magalu Cloud reserva 172.18.0.0/16 para redes privadas — usar blocos acima de 172.18.48.0\nVM lab-web-vm criada via CLI na VPC (Ubuntu 24.04, BV1-1-10, IP público)\nSecurity Group lab-firewall-agner criado com regras:\nSSH (porta 22) → ingress, restrito ao IP local\nHTTPS (porta 443) → ingress, aberto (0.0.0.0/0)\nEgress TCP, UDP e ICMP → liberados (protocolo 'any' não existe no mgc)\nSG associado à VM pelo painel (CLI não suporta update de SG em instância existente)\n\nTESTES DE CONECTIVIDADE\nServidor HTTP subido na porta 443: sudo python3 -m http.server 443\nTeste A — porta 443: curl retornou HTML com listagem de arquivos ✅\nTeste B — porta 8080: conexão recusada em milissegundos ✅ Security Group bloqueando no perímetro\nTeste C — SSH: conexão estabelecida normalmente ✅\nConceito validado na prática: em cloud a rede é definida por camadas — VPC para isolamento, subnets para segmentação, Security Groups para controle de acesso. A porta bloqueada não chega nem na VM.\n\nLIMPEZA\nOrdem correta: VM → Security Group → VPC (remove subnets junto)\nRecursos destruídos e ambiente zerado.\n\nBÔNUS — CONSUMPTION API\nAluno da turma compartilhou a Magalu Cloud Consumption API (v1) — retorna consumo D-1 em formato FOCUS v1.0. Potencial para criar dashboard de FinOps consumindo a API com gráficos por serviço. A testar.\n\nCONCEITOS CONSOLIDADOS\nVPC: rede privada isolada — contêiner lógico sem CIDR próprio no mgc CLI\nSubnet: divisão da VPC com CIDR próprio — criada via mgc network vpcs subnets create\nSecurity Group: firewall por instância — negação implícita, permissão explícita\nEgress obrigatório: sem regra de saída a VM não inicializa nem instala pacotes\nIP privado automático: VM herda IP da subnet da VPC onde foi criada\nLab material vs CLI real: sempre validar com --help — documentação pode estar desatualizada",
        tags: ["redes", "vpc", "subnet", "security groups", "firewall", "mgc", "cli", "conectividade", "curl", "ssh", "python", "http server", "consumption api", "finops", "prova", "módulo 5", "magalu cloud"],
      },

        title: "Módulo 4 — DBaaS PostgreSQL: SSH Tunnel, DBeaver e Lab SQL",
        content:          
          "Aula do Módulo 4 — Banco de Dados como Serviço (DBaaS) na Magalu Cloud. Laboratório prático completo com PostgreSQL 16, acesso remoto via SSH tunnel e gerenciamento pelo DBeaver.\n\nINSTÂNCIA DBaaS\nInstância maga-db provisionada pelo console da Magalu Cloud:\nPostgreSQL 16 | Tipo DP2-8-40 | Zona br-ne1-a\nIP privado apenas — sem exposição pública por padrão (boa prática de segurança)\n\nDESAFIO: ACESSO REMOTO\nDBaaS na Magalu Cloud só expõe IP privado — banco isolado na VPC, inacessível diretamente da máquina local. Tentativa de túnel SSH via VM de outra região (br-se1) falhou: redes privadas de regiões diferentes são isoladas.\n\nSOLUÇÃO: VM JUMPHOST\nCriada VM jumphost na mesma zona do banco (br-ne1-a):\nUbuntu 24.04 | BV2-2-10\nCom o jumphost na mesma rede privada do banco, o túnel SSH funcionou:\nssh -L 5432:IP_PRIVADO_BANCO:5432 ubuntu@IP_PUBLICO_JUMPHOST -i ~/.ssh/sua-chave -N\n\nEXPLICAÇÃO DO COMANDO\nssh → abre conexão SSH\n-L 5432:IP_PRIVADO_BANCO:5432 → redireciona porta local para o banco via VM\nubuntu@IP_PUBLICO_JUMPHOST → jumphost que serve de ponte\n-i ~/.ssh/sua-chave → chave privada de autenticação\n-N → mantém o túnel aberto sem executar comandos\n\nFluxo: Máquina local (localhost:5432) → túnel SSH → VM jumphost (br-ne1) → rede privada → DBaaS PostgreSQL\n\nDBeaver conectado em 127.0.0.1:5432 — acessa o banco na nuvem sem saber que está passando por um túnel. SSL TLSv1.3 ativo automaticamente.\n\nLABORATÓRIO SQL — BANCO loja\nCriado banco loja e 3 tabelas com relacionamentos:\ncliente (id_cliente, nome, email, cpf, telefone, data_cadastro)\nproduto (id_produto, nome, descricao, preco, estoque, ativo)\npedido (id_pedido, id_cliente FK, data_pedido, status, valor_total)\n\nCRUD COMPLETO EXECUTADO\nINSERT: 3 clientes, 3 produtos, 3 pedidos\nSELECT com JOIN: pedido + nome do cliente em uma só query\nFiltro: pedidos com status 'aberto'\nUPDATE: estoque, status de pedido, telefone de cliente\nDELETE: pedido e produto removidos\n\nDesafio final: novo cliente, novo produto (Headset), novo pedido, consulta filtrada, atualização de estoque e exclusão do pedido criado — tudo via DBeaver.\n\nBÔNUS: LOAD BALANCER ÓRFÃO\nDurante a aula, um aluno identificou um Load Balancer do Módulo 3 ainda ativo e sendo cobrado após a exclusão do cluster Kubernetes.\nComportamento da plataforma v3: LB não é excluído automaticamente junto com o cluster — precisa de limpeza manual.\nLB identificado e excluído via mgc CLI:\nmgc load-balancer network-loadbalancers delete <ID_DO_LB>\nResultado: results: [] — sem mais cobrança indevida.\n\nCONCEITOS CONSOLIDADOS\nDBaaS: banco gerenciado — patches, backup e failover automatizados, sem gerenciar SO\nIP privado por padrão: banco nunca exposto diretamente à internet\nJumphost: VM intermediária na mesma rede privada, serve de ponte para acesso externo\nSSH Tunnel (-L): redireciona porta local para destino remoto via servidor intermediário\nGrupos de Parâmetros: configurações do PostgreSQL gerenciadas pelo painel (MAX_CONNECTIONS, SHARED_BUFFERS, WORK_MEM etc.)\nPlataforma Kubernetes v3 vs v1: v3 não exclui LB automaticamente — limpeza manual obrigatória após deletar cluster",
        tags: ["dbaas", "postgresql", "ssh tunnel", "jumphost", "dbeaver", "sql", "crud", "join", "vpc", "rede privada", "load balancer", "kubernetes", "mgc", "magalu cloud", "módulo 4"],

        content:
          "Última aula do Módulo 3 — feriado em Serra-ES, jogo do Brasil, mas a aula rolou. Duas abordagens práticas de Object Storage na Magalu Cloud executadas da máquina local.\n\nBÔNUS DO DIA\ne-SUS APS PEC atualizado para a versão 5.5.19 durante a aula — download do instalador direto na VM, parada do serviço, execução do .jar em modo console. Migração do banco concluída 100% e servidor de aplicação subiu automaticamente.\n\nABORDAGEM 1 — RCLONE + FUSE\nInstalação do rclone na máquina local (Ubuntu).\nConfiguração do remote maga_bucket via arquivo ~/.config/rclone/rclone.conf:\ntype = s3, provider = Magalu, endpoint = https://br-se1.magaluobjects.com\nBucket criado: teste-aula-magalu\nAPI Key criada no console da Magalu Cloud e configurada no rclone.\nrclone lsd maga_bucket: → listou os dois buckets (esus-anexos-serra e teste-aula-magalu) ✅\nMontagem do bucket via FUSE:\nrclone mount maga_bucket:teste-aula-magalu ~/bucket-vm --vfs-cache-mode writes\nArquivo gravado localmente: echo \"teste\" | tee ~/bucket-vm/a.txt\nValidado no console da Magalu Cloud: a.txt apareceu no bucket (6B, STANDARD) ✅\nDesmontagem: fusermount3 -u ~/bucket-vm\n\nABORDAGEM 2 — BASH-COMMERCE + OBJECT STORAGE\nScript bash-commerce-object-storage-final.sh — fluxo completo:\nGera pedidos simulados em pedidos.csv\nCria snapshots versionados em snapshots/ a cada ciclo\nA cada 3 hits envia snapshot pro bucket via mgc object-storage objects upload\nAtualiza index.html com status, último objeto enviado e comando de presign\nServido via python3 -m http.server 8080\n\nPROBLEMA E SOLUÇÃO\nPrimeira execução: status \"Falha no upload\" — mgc não estava autenticado com API Key do Object Storage.\nSolução:\nmgc auth login\nmgc object-storage api-key create chave-aula\nmgc object-storage api-key set <UUID>\nApós autenticação: status mudou para \"Upload concluído com sucesso\" ✅\n31 snapshots enviados ao bucket com timestamps versionados.\n\nLIMPEZA\nrclone delete maga_bucket:teste-aula-magalu/pedidos\nBucket limpo e validado.\n\nCONCEITOS CONSOLIDADOS\nrclone: ferramenta universal para sincronizar arquivos com qualquer backend cloud\nFUSE: monta bucket S3 como pasta local — transparente para o sistema\nno_check_bucket: evita erros de validação em backends S3 compatíveis\nAPI Key Object Storage: credencial separada da autenticação geral da conta\nPresign: URL temporária para acesso a objeto privado sem expor credenciais\nObject Storage não tem disco — cresce infinitamente, cobra por uso\nDiferença Block vs Object: Block = disco anexado à VM; Object = arquivos acessados por URL",

        content:
          "Laboratório prático de Block Storage na Magalu Cloud — ciclo completo de criação, uso, snapshot e restauração.\n\nCONTEXTO\nAula ao vivo com o professor Gilmar. Região Sudeste instável — laboratório executado na região Nordeste (br-ne1).\nVM Debian 13.5 criada do zero para seguir o roteiro original.\n\nPASSO 1 — VOLUME ANEXADO\nVolume de 10GiB (NVME1K) criado e anexado à VM.\nlsblk confirmou /dev/vdb disponível sem partição.\n\nPASSO 2 — FORMATAÇÃO E MONTAGEM\nsudo mkfs.ext4 -F /dev/vdb\nsudo mkdir -p /dados\nsudo mount /dev/vdb /dados\nVolume montado com 9.8GB disponíveis.\n\nPASSO 3 — ARQUIVO DE TESTE\necho \"teste\" | sudo tee /dados/a.txt\nArquivo gravado e lido com sucesso.\n\nPASSO 4 — MONTAGEM AUTOMÁTICA NO BOOT\nUUID obtido via blkid e adicionado no /etc/fstab com opção nofail.\nTestado com umount + mount -a — arquivo persistiu.\n\nPASSO 5 — SNAPSHOT\nVolume desmontado (sync + umount) antes do snapshot para garantir consistência.\nSnapshot criado pelo painel: 20260625-214721-snapshot-volume-lab (10GiB, Disponível).\n\nPASSO 6 — QUEBRAR DE PROPÓSITO\nArquivo deletado: sudo rm /dados/a.txt\nDiretório /dados ficou apenas com lost+found.\n\nPASSO 7 — RESTAURAÇÃO\nMagalu Cloud usa Opção B: cria novo volume a partir do snapshot.\nNovo volume anexado à VM — apareceu como /dev/vdc.\nsudo mount /dev/vdc /dados\ncat /dados/a.txt → retornou \"teste\" ✅\n\nLIMPEZA\nVolumes desanexados e destruídos.\nSnapshot destruído.\nVM destruída.\n\nCONCEITOS CONSOLIDADOS\nBlock Storage: disco extra anexável à VM, independente do disco do sistema\nSnapshot: foto do volume em um momento — base para restauração ou novo volume\nnofail no fstab: sistema sobe mesmo se o volume não estiver disponível\nOpção A vs B: algumas clouds restauram no mesmo volume, outras criam um novo\nSnapshot também cobra — destruir junto com o volume ao encerrar o lab",
        tags: ["block storage", "snapshot", "restauração", "debian", "fstab", "ext4", "mount", "lsblk", "magalu cloud", "laboratório", "módulo 3"],
      },

        content:
          "Continuação e conclusão da sessão do Módulo 3 — o cluster saiu do papel e a aplicação chegou ao IP público.\n\nPARTE 1 — KUBECTL E NODES\nInstalado o kubectl na VM de testes. Configurado o kubeconfig do cluster ecommerce-agner.\nkubectl get nodes retornou 6 nodes Ready:\n3 control-plane (route-reflector) + 3 worker nodes — todos v1.35.2.\n2 nodes com erro de quota excedida (BV2-2-40) — cluster operou normalmente com os 3 workers disponíveis.\n\nPARTE 2 — SECRET DO REGISTRY\nCriado o secret docker-registry para o cluster autenticar no Container Registry privado da Magalu Cloud:\nkubectl create secret docker-registry magalu-registry-secret\nSem esse secret, o cluster não consegue fazer pull da imagem privada.\n\nPARTE 3 — DEPLOYMENT + LOADBALANCER\nAplicado o manifesto ecommerce-k8s.yaml:\n3 réplicas do pod ecommerce-web — cada uma em um worker node diferente\nService tipo LoadBalancer provisionou IP externo: [IP EXTERNO]\nAplicação acessível publicamente via http://ip-externo\n\nPARTE 4 — PROBLEMA IDENTIFICADO: ESTADO LOCAL\nCom 3 pods rodando, cada pod tinha seu próprio pedidos.csv.\nCada refresh do browser caía em um pod diferente (load balancer em ação) — dados inconsistentes entre pods.\nConceito importante: container é efêmero e stateless. Estado local não escala.\n\nPARTE 5 — SOLUÇÃO: REDIS COMO ESTADO COMPARTILHADO\nDeployment + Service do Redis adicionados ao cluster (redis:7-alpine).\napp.py refatorado — CSV substituído por Redis (lrange, rpush, lset, lrem, delete).\nTodos os pods agora leem e gravam no mesmo Redis — dados consistentes independente de qual pod responde.\n\nPARTE 6 — EVOLUÇÃO DA APLICAÇÃO\nVersão v2.0-redis: estado compartilhado via Redis.\nVersão v3.0-crud: adicionados botão de deletar por item (×) e botão Limpar tudo com confirmação.\nBanner no topo da interface exibe em tempo real o nome do pod que respondeu a requisição — demonstra visualmente o load balancer em ação.\nFluxo do desenvolvedor praticado: modificar código → rebuild → docker tag com versão → push → kubectl rollout restart → rolling update sem downtime.\n\nPARTE 7 — GITHUB\nProjeto versionado e publicado:\nhttps://github.com/AgnerLoss/ecommerce-agner\nArquivos: app.py, index.html, Dockerfile, ecommerce-k8s.yaml, redis-k8s.yaml, .gitignore\n\nARQUITETURA FINAL\nUsuário → LoadBalancer [IP] → Pod 1 / Pod 2 / Pod 3 → Redis (estado compartilhado)\nKubectl (qualquer máquina com kubeconfig) → opera o cluster remotamente\n\nCONCEITOS CONSOLIDADOS\nSecret docker-registry: permite ao cluster autenticar em registry privado\nRolling update: troca pods um a um sem derrubar a aplicação\nRedis como cache/estado: solução clássica para compartilhar estado entre réplicas stateless\nVersionamento de imagem (v1, v2.0-redis, v3.0-crud): rastreabilidade e rollback\nKubeconfig: credencial de acesso ao cluster — funciona de qualquer máquina",

        content:
          "Implementação do backup híbrido do e-SUS APS PEC no ambiente de homologação. Fluxo completo validado e agendado via cron.\n\nCONTEXTO\nO banco de homologação roda PostgreSQL 9.6.13 embarcado (porta 5433), instalado pelo próprio e-SUS em /opt/e-SUS/database. O backup híbrido complementa o backup automático do DBaaS em produção — garantindo a regra 3-2-1.\n\nDIFERENÇA ENTRE DUMP E BACKUP\nBackup: cópia física dos arquivos do PostgreSQL — preso à mesma versão e SO.\nDump (pg_dump): exportação lógica portátil — funciona entre versões e sistemas operacionais diferentes. É o método correto para migração Windows → Linux.\n\nFLUXO IMPLEMENTADO\nPostgreSQL 9.6 (e-SUS)\n  → pg_dump → /backup/esus_YYYYMMDD.dump\n  → rclone → Google Drive (Magalu-cloud/dumps-teste)\n  → limpeza automática de dumps com mais de 7 dias\n\nPACOTES INSTALADOS\npostgresql-client-9.6 — via repositório oficial postgresql.org\nrclone v1.74.3 — via script oficial rclone.org\n\nCONFIGURAÇÃO DO RCLONE\nRemote: drive-esus (Google Drive)\nAutenticação: token OAuth via rclone authorize no computador local (sem navegador no servidor)\nPasta de destino: Meu Drive → Magalu-cloud → dumps-teste\n\nSCRIPT /opt/scripts/backup-esus.sh\nDump com PGPASSWORD inline\nLog em /backup/backup.log com timestamp\nEnvio via rclone copy\nLimpeza de dumps locais com mais de 7 dias (find -mtime +7)\n\nAGENDAMENTO CRON\n0 10 * * * /opt/scripts/backup-esus.sh\nServidor configurado para America/Sao_Paulo via timedatectl — permanente nos reboots.\nBackup roda todo dia às 10h horário de Brasília. Validado: cron executou às 10:00 e gerou nova versão no Drive automaticamente, sem intervenção manual.\n\nCUSTO EM PRODUÇÃO\nDump comprimido estimado: ~7GB\nTráfego de saída Magalu: ~R$1,75 por backup\nCusto mensal (diário): ~R$52/mês\nDecisão: custo dentro do aceitável para prefeitura — regra 3-2-1 completa todo dia vale o investimento.\n\nREGRA 3-2-1 APLICADA EM PRODUÇÃO\nCópia 1 → DBaaS Magalu (backup automático gerenciado)\nCópia 2 → Object Storage Magalu (interno, tráfego gratuito)\nCópia 3 → Google Drive via rclone ✅ (validado hoje, ~R$52/mês)\n\nOBSERVAÇÃO\nO token OAuth do rclone expira periodicamente. Em produção, o ideal é usar uma Service Account do Google com JSON key — sem expiração, sem interação manual.",

        title: "Sessão de Arquitetura — e-SUS Produção, Migração e Dimensionamento",
        content:
          "Sessão completa de planejamento da arquitetura definitiva de produção do e-SUS APS PEC para a Secretaria Municipal de Saúde de Serra-ES.\n\n━━ PARTE 1 — ARQUITETURA DE PRODUÇÃO ━━\n\nContexto: ambiente de homologação já funcionando. Foco agora é produção — dados reais de cidadãos de 40 UBSs, cobertos pela LGPD.\n\nRequisitos do Ministério da Saúde para 100 usuários simultâneos:\n2 servidores separados (app + banco), 8GB RAM DDR4, Quad Core 2.2GHz\nDisco app: 100GB | Disco BD: 120GB | PostgreSQL mínimo 9.6\n\nArquitetura final decidida:\nVM Aplicação   → 1x Linux, 4 core, 8GB, 100GB  → R$   219,99/mês\n                + Snapshot automático diário\nDBaaS          → Multi zona, DP4-16, 15K IOPS  → R$ 2.416,65/mês\n                + 100GiB, PostgreSQL, backup e failover automáticos\nObject Storage → 150GiB (anexos de prontuário) → R$    37,50/mês\n                + Multi AZ nativo\nVPC            → sem custo direto\nTotal mensal   →                                  R$ 2.674,14/mês\nTotal anual    →                                  R$ 32.089,68/ano\nTotal 3 anos   →                                  R$ 96.269,04\n\nDecisões e justificativas:\n\n1. DBaaS em vez de VM de banco\nBanco é o ativo mais crítico. DBaaS Multi AZ entrega replicação automática entre zonas, failover sem intervenção manual, backup gerenciado e patches automáticos. VM de banco manual exigiria gerenciar tudo isso — inviável em produção com LGPD.\n\n2. VM de aplicação sem Multi AZ\nCamada de aplicação é stateless. Se cair, sobe nova VM em minutos. Snapshot diário automático é suficiente.\n\n3. Object Storage para anexos\nFuncionalidade de Anexo de Arquivos estava desabilitada no on-premise de Serra por falta de infraestrutura. Na nuvem entregamos isso desde o primeiro dia.\n\n4. VPC sem custo extra\nSem cobrança direta — paga só tráfego de saída. Para usuários internos via Cloudflare, custo irrelevante.\n\n5. Escalabilidade confirmada\nVM: redimensiona online. DBaaS: escala vertical sem downtime. Object Storage: cresce sozinho.\n\n6. Desligamento programado descartado\nAvaliamos desligar a VM fora do horário via GitHub Actions Secrets. Descartado por segurança — ambiente com dados de saúde não comporta esse risco. Mês cheio.\n\n7. Magalu Cloud não tem Reserved Instances\nModelo pay-as-you-go. Consumo acima de R$3.000/mês dá acesso a TAM exclusivo — abre espaço para negociação comercial direta.\n\n━━ PARTE 2 — VIABILIDADE JURÍDICA ━━\n\nCusto anual de R$32.089,68 cabe no limite de dispensa de licitação por valor (Lei 14.133/2021, serviços até R$57.184,00). Porém Magalu Cloud não é fornecedor exclusivo — AWS, Azure e Google Cloud concorrem no mesmo mercado, inviabilizando inexigibilidade.\n\nDispensa por valor: cabe no limite, mas exige renovação anual — menos seguro para contrato continuado.\nPregão Eletrônico: processo mais longo, mas permite contrato plurianual (até 5 anos) e é mais robusto juridicamente.\n\nOrientação: Pregão com especificação técnica detalhada baseada nos requisitos do MS (Multi AZ, DBaaS PostgreSQL, Object Storage S3, 100 usuários simultâneos) direciona naturalmente para quem atende. Consultar jurídico da prefeitura.\n\n━━ PARTE 3 — PLANO DE MIGRAÇÃO ━━\n\nContexto do banco atual:\nTamanho: ~36GB | Windows Server 2016, PostgreSQL embarcado porta 5433\n40 UBSs atendidas | Projeção: ~20% ao ano → ~62GB em 3 anos\nDecisão: DBaaS 100GiB → margem saudável sem redimensionar ✅\n\nRiscos e mitigações:\n1. Versão PostgreSQL (9.6/13 → 16): dump/restore em homologação antes da virada\n2. Perda de dados: backup full do banco Windows antes de qualquer movimento\n3. Comportamento no Linux: e-SUS é multiplataforma, homologação já valida\n4. Equipe sem familiaridade Linux: ambiente de homologação já funcionando\n\nPlano passo a passo:\nPasso 1 — Verificar versão atual\n\"C:\\Program Files\\e-SUS\\PostgreSQL\\bin\\psql.exe\" -U postgres -p 5433 -c \"SELECT version();\"\n\nPasso 2 — Dump do banco Windows\npg_dump.exe -U postgres -p 5433 -d esus -F c -f C:\\backup\\esus_producao.dump\n\nPasso 3 — Restore no DBaaS de homologação\npg_restore -h <host-dbaas-homolog> -U postgres -d esus -F c esus_producao.dump\n\nPasso 4 — Validação de integridade\nSELECT COUNT(*) FROM tb_cidadao;\nSELECT COUNT(*) FROM tb_prontuario;\nSELECT COUNT(*) FROM tb_atendimento_individual;\nComparar com contagem do banco Windows. Profissional de saúde abre prontuários reais e valida visualmente.\n\nPasso 5 — Validar log na subida\ntail -f /opt/e-SUS/webserver/logs/pec.log\nErro Liquibase = incompatibilidade de versão PostgreSQL.\n\nPasso 6 — Operação paralela (2 a 4 semanas)\nWindows on-premise e Linux nuvem simultaneamente. Só desliga o Windows após aprovação dos profissionais de saúde.\n\n━━ PARTE 4 — DIMENSIONAMENTO OBJECT STORAGE ━━\n\nDados reais (Relatório de Atendimento Individual jun/2025 a mai/2026):\nTotal de atendimentos: 1.096.777\n47 unidades de saúde (ESFs, UBSs, URSs, CAPS, AMES)\nMaior mês: 104.996 (mar/2026) | Menor mês: 77.828 (dez/2025)\nMédia mensal: ~91.398 atendimentos\n\nPremissas:\n10% dos atendimentos geram upload (resultados, laudos, PDFs)\nTamanho médio: 1MB por arquivo\nRetenção legal: 20 anos (Lei 13.787/2018)\n\nProjeção de volume:\nArquivos/ano: 109.677 | Volume/ano: ~107GB\nAno 1: ~107GB | Ano 5: ~535GB | Ano 10: ~1TB | Ano 20: ~2TB\n\nImpacto no custo mensal:\nAno 1  → 150GiB  → R$  37,50/mês\nAno 2  → 250GiB  → R$  62,50/mês\nAno 5  → 600GiB  → R$ 150,00/mês\nAno 10 → 1TiB    → R$ 256,00/mês\n\nArquitetura revisada com projeção:\nTotal ano 1:  R$ 2.674,14/mês\nTotal ano 5:  R$ 2.786,64/mês\nTotal ano 10: R$ 2.892,64/mês\n\nCrescimento de +R$218/mês em 10 anos — irrelevante frente ao benefício. A funcionalidade de anexo de arquivos não existe hoje no on-premise de Serra. Na nuvem está disponível desde o primeiro dia, com crescimento elástico e automático.\n\nEssa não é só uma migração técnica — é a entrega de uma funcionalidade clínica que os profissionais de saúde de Serra nunca tiveram.",

        title: "Trilha de 100h — Estrutura do Programa",
        content:
          "Módulo 1 — Fundamentos de Sistemas e Infraestrutura (24h)\nMódulo 2 — Serviços Essenciais de Cloud Computing (24h)\nMódulo 3 — Desenvolvimento e Operação de Aplicações — DevOps (22h)\nMódulo 4 — Observabilidade e Resiliência de Sistemas (15h)\nMódulo 5 — Arquitetura de Soluções em Nuvem (15h)\n\nTotal: 100 horas. Formato: teoria + projetos práticos. Mínimo de 75% de presença.",
        tags: ["trilha", "módulos", "cloud", "devops", "arquitetura"],
      },
      {
        id: 1,
        date: "2026-05-26",
        type: "marco",
        title: "Kickoff do Movetech — Cerimônia de Abertura",
        content:
          "Participei da cerimônia de abertura do Programa Move Tech Magalu com mais de 125 pessoas conectadas. Apresentação completa da trilha: 100 horas de conteúdo técnico divididas em 5 módulos. Assinei o Termo de Responsabilidade e confirmei presença. A primeira aula começa em 08/06 — segunda a quinta, das 19h às 22h. Plataforma: Google Classroom. Comunicação via e-mail e WhatsApp. Ao final do curso, quem se destacar entra no processo seletivo para vagas no Magalu!",
        tags: ["kickoff", "magalu cloud", "movetech", "abertura"],
      },
    ];

    const typeConfig = {
      estudo:   { label: "Estudo",    color: "#0EA5E9", icon: "📚" },
      projeto:  { label: "Projeto",   color: "#10B981", icon: "🛠️" },
      marco:    { label: "Marco",     color: "#F59E0B", icon: "🏁" },
      reflexao: { label: "Reflexão",  color: "#8B5CF6", icon: "💡" },
    };

    const months = ["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];
    const fmtDate = iso => {
      const [y, m, d] = iso.split("-");
      return { day: d, month: months[+m - 1], year: y };
    };

    let activeFilter = "todos";

    function renderStats() {
      const el = document.getElementById("stats");
      el.innerHTML = Object.entries(typeConfig).map(([k, cfg]) => {
        const count = entries.filter(e => e.type === k).length;
        return `<div class="mt-stat" style="border-color:${cfg.color}">
          <span class="mt-stat-icon">${cfg.icon}</span>
          <span class="mt-stat-count" style="color:${cfg.color}">${count}</span>
          <span class="mt-stat-label">${cfg.label}s</span>
        </div>`;
      }).join("");
    }

    function renderFilters() {
      const el = document.getElementById("filters");
      const all = ["todos", ...Object.keys(typeConfig)];
      el.innerHTML = all.map(f => {
        const label = f === "todos" ? "Todos" : `${typeConfig[f].icon} ${typeConfig[f].label}`;
        const active = f === activeFilter ? "active" : "";
        const style = (f !== "todos" && f === activeFilter)
          ? `style="border-color:${typeConfig[f].color};color:${typeConfig[f].color}"` : "";
        return `<button class="mt-filter-btn ${active}" ${style} onclick="setFilter('${f}')">${label}</button>`;
      }).join("");
    }

    function renderTimeline() {
      const el = document.getElementById("timeline");
      const list = activeFilter === "todos" ? entries : entries.filter(e => e.type === activeFilter);
      const sorted = [...list].sort((a, b) => a.date === b.date ? b.id - a.id : (a.date < b.date ? 1 : -1));
      if (!sorted.length) {
        el.innerHTML = `<p class="mt-empty">Nenhuma entrada ainda nessa categoria.</p>`;
        return;
      }
      el.innerHTML = sorted.map(entry => {
        const cfg = typeConfig[entry.type];
        const { day, month, year } = fmtDate(entry.date);
        const tags = entry.tags.map(t => `<span class="mt-tag">${t}</span>`).join("");
        return `
          <div class="mt-entry">
            <div class="mt-date">
              <span class="mt-day">${day}</span>
              <span class="mt-mon">${month}</span>
              <span class="mt-year">${year}</span>
            </div>
            <div class="mt-line" style="background:${cfg.color}"></div>
            <div class="mt-card" style="border-left-color:${cfg.color}">
              <span class="mt-type-badge" style="background:${cfg.color}22;color:${cfg.color}">${cfg.icon} ${cfg.label}</span>
              <h2 class="mt-entry-title">${entry.title}</h2>
              <p class="mt-entry-body">${entry.content}</p>
              ${tags ? `<div class="mt-tags">${tags}</div>` : ""}
            </div>
          </div>`;
      }).join("");
    }

    function setFilter(f) {
      activeFilter = f;
      renderFilters();
      renderTimeline();
    }

    renderStats();
    renderFilters();
    renderTimeline();
    </script>

</body>
</html>
