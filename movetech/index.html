        type: "reflexao",
        title: "As habilidades que não aparecem no terminal — soft skills pela ótica de quem gere um sistema crítico de saúde",
        content:
          "O Movetech tem uma trilha complementar de soft skills na Universidade Luiza. Fechei os cinco módulos: Comunicação Assertiva, Conversas Difíceis, Influenciar Pessoas, Mindset Analítico e Apresentações de Impacto. Podia despachar isso como 'fiz um curso de comunicação', mas seria desonesto com o que realmente aconteceu. O que esses módulos fizeram foi dar nome a coisas que eu já pratico há anos gerindo TI em saúde pública, e mostrar onde eu ainda escorrego. Este registro é sobre isso: as habilidades que não aparecem no terminal, mas decidem se um projeto técnico vira realidade ou morre numa reunião.\n\nO PANO DE FUNDO: GERIR TI EM SAÚDE NÃO É SÓ TÉCNICO\nQuem administra a infraestrutura de dezenas de unidades de saúde sabe que o dia raramente é sobre o comando certo. É sobre explicar pra uma equipe clínica por que o sistema caiu sem soar como desculpa. É sobre convencer um gestor não-técnico a investir em backup antes do desastre, não depois. É sobre dizer não a um prazo impossível sem queimar a relação. O e-SUS, o prontuário eletrônico que eu venho estudando migrar pra nuvem, é o pano de fundo perfeito pra enxergar isso, porque é um sistema onde a falha tem custo humano, e onde a decisão técnica sempre precisa ser vendida pra quem não fala a língua da infraestrutura.\n\nMINDSET ANALÍTICO: EU JÁ ERA UM DETETIVE DE DADOS, SÓ NÃO SABIA O NOME\nO módulo fala do Mundo BANI (Frágil, Ansioso, Não-linear, Incompreensível) e de decidir por evidência, não por achismo. Isso é a descrição literal de operar infraestrutura: um outage não avisa, não é linear, e a causa costuma ser incompreensível até você investigar em camadas. A técnica dos 5 Porquês que o módulo ensina é exatamente o método que eu já uso pra caçar causa-raiz. E o conceito de viés de ancoragem (travar na primeira informação) explica a minha lição de FinOps mais concreta: todo mundo assume que o LoadBalancer é o vilão do custo na nuvem. Eu fui na fatura real e descobri que o maior custo era o Block Storage NVMe, não o LoadBalancer. Isso não foi sorte, foi recusar a âncora e olhar o dado. O módulo me deu o vocabulário pra explicar por que eu trabalho assim.\n\nINFLUENCIAR PESSOAS: COMO SE DEFENDE UMA ARQUITETURA\nAqui veio o insight que mais vou levar. A tríade Ethos, Pathos e Logos, de Aristóteles, é o mapa exato de como se defende uma decisão técnica. Logos é o dado: o FinOps, os R$ por mês, o comparativo nuvem versus on-premise. É onde o pessoal de infra se sente confortável. Mas Logos sozinho não fecha. Ethos é a credibilidade: o projeto documentado, os registros de decisão versionados, o histórico que prova que você sabe do que fala, é por isso que documentar não é burocracia, é construção de autoridade. E Pathos é o propósito: um exame de paciente perdido é irrecuperável, uma unidade de saúde sem sistema é gente sem atendimento. Quando eu defendo migrar o e-SUS pra nuvem, os três estão em jogo ao mesmo tempo, e eu fazia isso no instinto. O módulo me mostrou que faltava, muitas vezes, o Pathos, o técnico tende a achar que o número fala sozinho. Não fala. A decisão convence pela razão, mas emplaca pela conexão com o que importa.\n\nO módulo cravou uma linha que eu respeito: persuasão não é manipulação. Persuadir traz benefício pra quem você convence; manipular beneficia só você. Defender uma arquitetura melhor pro município está do lado certo dessa linha. É bom ter isso explícito.\n\nCOMUNICAÇÃO ASSERTIVA E CONVERSAS DIFÍCEIS: O NÃO QUE PROTEGE O SISTEMA\nEsses dois andam juntos. Comunicação assertiva é dizer o que precisa ser dito, direto, sem agredir e sem engolir. Pra quem gere TI, o exemplo clássico é o prazo: dizer não a uma janela de manutenção impossível não é ser difícil, é proteger a integridade de um sistema crítico. O módulo de Conversas Difíceis trouxe um conceito que me pegou, o diálogo da identidade: a conversa mais difícil às vezes não é com o outro, é o que a decisão diz sobre quem você é. Pra um gestor público que constrói um caminho novo em cloud, isso tem endereço. E a lição que fica é separar o fato (o log, o dado, o prazo real) da emoção (a pressão, o medo do incidente), porque conversa difícil descarrilha quando vira disputa de quem tem mais razão em vez de foco no problema.\n\nAPRESENTAÇÕES DE IMPACTO: ONDE TUDO SE ENCONTRA\nO último módulo amarra os outros quatro. Apresentar com impacto é comunicar a decisão com clareza (assertividade), sustentá-la com dado (mindset analítico) e convencer com credibilidade e propósito (Ethos, Pathos, Logos). É a vitrine de todos eles juntos. Uma defesa de arquitetura, um pitch de projeto, uma reunião com quem decide o orçamento, tudo isso é apresentação de impacto. E o projeto e-SUS, com sua documentação aberta, seu FinOps transparente e seu propósito de saúde pública, é o material que eu quero levar pra essas mesas.\n\nO QUE FICA\nNão saí desses módulos uma pessoa diferente. Saí com um mapa das coisas que eu já fazia sem saber nomear, e com um alerta sobre onde eu falho, geralmente no Pathos, no lado humano do argumento, porque é fácil se esconder atrás do número. A parte técnica do Movetech me deu ferramenta. A trilha de soft skills me deu a consciência de que, na saúde pública, a melhor arquitetura do mundo não vale nada se você não souber decidir com dados e convencer com verdade quem precisa dizer sim. Essas habilidades não aparecem no terminal. Mas são elas que tiram um projeto do papel.",

        type: "estudo",
        title: "Revisando uma decisão — por que os anexos saíram do Object direto para Block primário + Object backup",
        content:
          "Toda arquitetura carrega decisões que envelhecem. Ao consolidar o projeto e-SUS num repositório de referência com ADRs, revisitei uma escolha que eu tinha feito lá no começo do Movetech e cheguei à conclusão de que ela estava errada — ou, sendo justo, incompleta. Este registro é sobre essa virada, e sobre por que eu prefiro documentar a mudança a reescrever o passado.\n\nA DECISÃO ANTIGA\nNos primeiros planejamentos da arquitetura (registrados aqui mesmo no diário), eu tinha definido os anexos de prontuário indo direto para o Object Storage como armazenamento primário. A lógica parecia sólida na época: Object Storage é elástico, cresce sozinho, custa pouco por GB, é compatível com S3 e o e-SUS aceita apontar um destino de arquivos. No papel, fechava.\n\nO QUE EU NÃO TINHA PESADO DIREITO\nO ponto que me escapou é a natureza real do e-SUS. Ele é um monolito Java stateful que espera um filesystem POSIX de verdade — abrir, escrever, dar seek, fechar, com semântica de arquivo local. Object Storage não é filesystem: é um armazenamento de objetos acessado por API HTTP (PUT/GET). Para o e-SUS enxergar um bucket como se fosse pasta, seria preciso montar o Object via FUSE (rclone mount, que eu inclusive já testei no Módulo 3).\n\nE é aí que mora o problema. Mount de Object Storage via FUSE no caminho crítico de uma aplicação clínica é frágil: a latência é de rede, não de disco; operações que o filesystem faz num piscar (rename, lock, append) viram sequências de chamadas HTTP que podem falhar no meio; e uma queda de conectividade momentânea, que num disco local seria irrelevante, vira erro de escrita de anexo. Para um sistema que registra exame de paciente, isso não é aceitável. O que num laboratório é 'funciona', na produção de saúde é 'funciona até o dia em que não funciona, e aí perdeu o anexo'.\n\nA DECISÃO NOVA (ADR 0004)\nA arquitetura de referência passou a usar Block Storage como armazenamento primário dos anexos — um volume de bloco montado como filesystem nativo no diretório de anexos do e-SUS, exatamente a semântica que o sistema espera, com latência e confiabilidade de disco. E o Object Storage não foi descartado: ele virou a camada de backup, recebendo uma sincronização periódica do conteúdo do volume. Cada storage no papel que faz melhor: Block entrega filesystem confiável para a aplicação escrever; Object entrega durabilidade barata e off-site para o backup dormir tranquilo.\n\nO CUSTO DA MUDANÇA\nRefiz as contas com dados reais de dimensionamento (cerca de 1,1 milhão de atendimentos por ano, ~10% gerando anexo de ~1MB, retenção legal de 20 anos pela Lei 13.787/2018, ~107GB no primeiro ano). Um volume inicial de 150GB cobre o ano 1 com folga. Nos preços da Magalu: Block Storage 150GB no tier de 1.000 IOPS a R$0,58/GiB dá R$87,00/mês, mais o backup em Object Storage 150GiB a R$0,25/GiB dá R$37,50/mês. Total de R$124,50/mês para os anexos. O tier de 1.000 IOPS é suficiente de propósito: anexo de prontuário tem acesso pontual (o profissional anexa um exame de vez em quando), não exige a performance dos tiers altos. O custo do backup é justificado pela criticidade: exame perdido é irrecuperável, e a retenção de 20 anos é lei.\n\nPOR QUE NÃO REESCREVI O PASSADO\nEu poderia ter voltado nos posts antigos e trocado 'Object' por 'Block' pra fingir que sempre soube. Preferi não. As entradas antigas são o registro honesto de como eu raciocinava naquele momento, com o conhecimento que eu tinha. Apagar isso apagaria a parte mais valiosa: a evolução. Um portfólio que só mostra acertos de primeira é suspeito. Um que mostra uma decisão sendo revista com base em evidência mostra a única coisa que interessa de verdade num arquiteto — a capacidade de mudar de ideia quando os fatos pedem, e de deixar registrado o porquê.\n\nO QUE FICA\nA lição não é 'Block é melhor que Object' — os dois são ótimos no lugar certo. A lição é decidir pela natureza real do sistema, não pela característica mais bonita do serviço no marketing. Object Storage é elástico e barato, e isso me seduziu antes de eu perguntar se o e-SUS sabia conversar com ele do jeito que ele fala. Sabe, mas mal, e no lugar errado. A pergunta certa não era 'qual storage é mais moderno', era 'o que essa aplicação espera embaixo dela'. Essa pergunta agora vem primeiro.",
        tags: ["arquitetura", "block storage", "object storage", "esus", "adr", "finops", "filesystem", "fuse", "decisão de arquitetura", "revisão", "magalu cloud", "movetech"],
      },

        id: 35,
        date: "2026-08-07",

        title: "Movetech — o balanço de uma travessia",
        content:
          "As aulas ao vivo acabaram e as notas fecharam. É hora de olhar pra trás e medir a travessia. Entrei no Movetech como gestor de infraestrutura querendo virar a chave pra cloud hands-on. Saio com um histórico que fala por si e, mais importante, com um método na cabeça que não estava lá quando comecei.\n\nO QUE FOI CONSTRUÍDO\nNão foi assistir aula. Foi construir. Ao longo das competências eu montei cluster do zero, quebrei e consertei sistemas de propósito pra entender resiliência, subi observabilidade com Prometheus e Grafana, fiz deploy via CI/CD em produção de verdade na Magalu Cloud, vi o autoscaling escalar sob carga com teste de k6, e documentei arquitetura com C4 e ADRs. Cada competência deixou uma peça concreta, versionada no GitHub, que eu posso abrir e mostrar.\n\nA GRANDE FINAL\nA última entrega, a documentação de arquitetura, foi onde tudo se juntou. Documentei a solução com diagramas C4 e registros de decisão, mas não parei na teoria. Subi a aplicação rodando de verdade em um cluster gerenciado na Magalu, com pipeline, HPA validado sob carga e observabilidade. E fiz a análise de custo a partir das faturas reais da conta, o que me rendeu a lição de FinOps mais concreta de todas: o maior custo não estava onde eu imaginava. O instrutor devolveu a entrega com uma palavra que eu vou guardar: fantástica. Vindo de quem acompanhou essa evolução desde o começo, significa muito.\n\nO QUE MUDOU EM MIM\nO mais valioso não é a lista de ferramentas. É a forma de pensar. Aprendi a ler um sistema antes de desenhá-lo, a decidir por requisito e não por currículo, a registrar o porquê de cada escolha, a tratar custo como parte da arquitetura, e a limpar o ambiente depois pra não deixar conta aberta. Descobri que já tomava decisões de arquiteto sem saber o nome disso. Agora sei o nome, e sei registrar.\n\nO QUE VEM AGORA\nNão é o fim, é a virada de fase. Começam as atividades assíncronas e a grande final do programa, no meu ritmo, que é onde me sinto mais em casa: local primeiro, um passo de cada vez, tudo validado. E fora do curso, o método agora é meu pra aplicar onde eu quiser, começando pelo meu próprio projeto de migração de um sistema crítico de saúde pra nuvem.\n\nMovetech não foi um curso que eu fiz. Foi uma travessia que eu atravessei. E do outro lado tem um profissional diferente do que entrou.",

        title: "Última aula ao vivo — as esquinas da vida",
        content:
          "Hoje foi a última aula síncrona do Movetech com o Gilmar. Fim de uma etapa, e daquelas que ficam. Agradeci a ele e à turma, e falei uma coisa que sentia de verdade: cada um chegou aqui com sua própria história, seu próprio motivo, sua própria batalha para estar naquela sala virtual às sete da noite depois de um dia inteiro.\n\nO QUE O TEMPO CONTA\nTem um jeito de medir esse curso que não é em horas nem em módulos. Quando comecei, a Liz tinha quatro meses. Hoje ela fez seis. Foram dois meses da minha vida — com filha pequena, prova feita no meio de criança doente, madrugada montando cluster na Magalu enquanto a casa dormia. O curso e a vida entrelaçados, como sempre são as coisas que valem a pena.\n\nO QUE FICA DO PERCURSO\nEntrei como gestor de infraestrutura querendo virar a chave para cloud hands-on. Saio tendo construído cluster do zero, quebrado e consertado sistemas de propósito para entender resiliência, montado observabilidade, feito deploy via CI/CD em produção, visto o autoscaling escalar sob carga, e documentado tudo com a disciplina de quem trata infraestrutura como produto. Não foi fazer um curso. Foi construir prova concreta de que a transição é real.\n\nO GRUPO\nMas o que levo de mais forte não é a parte técnica. É a humildade da turma, a troca, o Gilmar adaptando o conteúdo ao ritmo da gente, a sensação de que ninguém estava competindo — estávamos todos tentando mudar de vida, cada um do seu jeito. Falei que a gente ia se encontrar nas esquinas da vida. Acredito nisso. Gente que trilha o mesmo caminho acaba se cruzando de novo, mais adiante.\n\nAINDA NÃO ACABOU\nE, para ser honesto, não é bem uma despedida. Acabaram as aulas ao vivo, mas agora começa a fase das atividades assíncronas — a grande final, os projetos, as entregas no meu ritmo. É a parte em que o programa deixa de empurrar e passa a ser eu conduzindo. Que, sinceramente, é onde me sinto mais em casa: local primeiro, um passo de cada vez, tudo validado.\n\nEntão fica o registro. Obrigado, Gilmar. Obrigado, turma. Nos vemos nas esquinas.",
        tags: ["movetech", "reflexao", "carreira", "gratidao", "transicao", "marco"],
      },
      {
        id: 33,
        date: "2026-08-04",
        type: "projeto",
        title: "Resiliência na prática — quebrar de propósito, investigar e ver o cluster se curar sozinho",
        content:
          "Dois laboratórios que fecham a Competência 5 e são o par perfeito: primeiro provocar uma falha de propósito e investigar como um outage real; depois testar a auto-recuperação do cluster. Um ensina a diagnosticar quando quebra; o outro prova que o Kubernetes se levanta sozinho. Juntos, são o arco completo da resiliência — e a versão controlada do outage que já vivi no e-SUS de verdade.\n\nLAB 4 — SIMULAR FALHA E INVESTIGAR\nO enunciado era corromper de propósito a conexão com o banco, ver a aplicação quebrar, diagnosticar a causa raiz e restaurar. A ideia é ensaiar um incidente num ambiente onde eu posso errar sem consequência — chaos preventivo, não apagar incêndio às três da manhã.\n\nA PREPARAÇÃO QUE SALVA\nAntes de quebrar qualquer coisa, capturei o estado bom: o valor real do Secret db-secret decodificado e um backup do objeto em disco. Rede de segurança montada antes do risco — princípio que não se negocia ao mexer em algo que precisa voltar a funcionar.\n\nDetalhe que já anotei de outras vezes: a chave dentro do Secret se chama url, não DATABASE_URL. Confirmar o nome da chave antes de aplicar o patch é o que evita criar uma chave nova em vez de sobrescrever a certa — e a falha não aconteceria como planejado.\n\nA FALHA INJETADA\nGerei uma string de conexão com o host do banco trocado por um endereço que não existe, apliquei via kubectl patch e forcei o rollout. Segredo injetado como variável de ambiente não recarrega sozinho — o pod lê o Secret uma vez, no start. Por isso o rollout restart: pod novo nasce já com a configuração quebrada.\n\nE aí veio o CrashLoopBackOff nascer ao vivo, com o backoff exponencial escancarado: as tentativas se espaçaram de dez segundos para trinta, cinquenta, cem, três minutos, seis minutos. O Kubernetes não fica reiniciando em loop cego — ele espera cada vez mais entre as tentativas, protegendo o sistema de um flapping infinito. Isso não é o cluster falhando; é o cluster se defendendo.\n\nA INVESTIGAÇÃO EM DUAS CAMADAS\nO describe do pod contou a história de fora: a imagem fez pull com sucesso todas as vezes, o container foi criado e iniciado seis, sete vezes, e o BackOff repetia. Quando o describe mostra pull ok e container startando em loop, a falha não é de plataforma nem de imagem — é dentro da aplicação. Isso me mandou direto pros logs.\n\nE o log da instância anterior — o kubectl logs --previous — entregou o ouro. Num CrashLoop, o container atual ou está subindo ou já morreu; o log útil é sempre o do container que crashou antes. O traceback morria em main.py, na linha que toca o banco durante o boot, com a mensagem exata: não foi possível resolver o nome do host do endereço fantasma. Causa raiz isolada.\n\nUma lição de arquitetura ficou dessa investigação: a aplicação tenta conectar no banco no import do módulo, durante a subida. Sem banco alcançável, o servidor nem termina de carregar — o crash é imediato e total. É o mesmo tipo de fragilidade que derrubou meu HikariPool no e-SUS real: aplicação amarrada demais à saúde do banco no momento do boot.\n\nA PROVA NOS GOLDEN SIGNALS\nA parte que mais ensinou foi cruzar a falha com o Grafana. De quatro Golden Signals, um só enxergou o incidente: a Saturação. O painel de CPU mostrava o pod quebrado num serrilhado — cada pico era uma tentativa de boot consumindo processador antes de morrer. E Tráfego, Erros e Latência? Limpos, verdes, como se nada estivesse acontecendo.\n\nO motivo é a lição de SRE mais fina da competência: o pod quebrado nunca passou no readiness, então nunca entrou no Service, então nenhuma requisição foi roteada pra ele. Uma falha de deploy que trava no boot ataca pela capacidade — você perde silenciosamente os pods de reserva — não pela taxa de erro. Se eu só monitorasse 5xx, esse outage seria invisível. Quem me avisa dele é a saturação e o alerta de réplicas indisponíveis, não o painel de erros.\n\nE os dois pods antigos seguiram Running o tempo todo. O rolling update travou de propósito: pod novo ruim jamais derruba o pod velho bom. Deploy quebrado, zero downtime pro usuário.\n\nA RESTAURAÇÃO E A ARMADILHA DO APPLY\nNa hora de voltar, o kubectl apply do backup falhou com conflito: o objeto tinha um resourceVersion antigo, e o patch da falha já havia avançado a versão no cluster. O Kubernetes recusa aplicar por cima de uma versão desatualizada — é proteção de concorrência, optimistic locking, não erro meu.\n\nA saída limpa foi não depender do YAML de backup e sim aplicar o valor bom direto via patch na chave específica. Duas lições: backup de Secret pra restaurar deve guardar só o dado, não o objeto inteiro com seus campos voláteis; e num incidente real, patch cirúrgico na chave é mais seguro que apply do objeto todo. Rollout, e os pods voltaram Running na versão saudável — com o próprio rollout status narrando a cura: réplica nova validada primeiro, réplica velha terminada só depois.\n\nLAB 5 — TESTAR RESILIÊNCIA\nCom a falha entendida, o Lab 5 vai pro outro lado: provar que o cluster se recupera sozinho. Duas partes, dois mecanismos.\n\nAUTO-CURA — MATAR UM POD\nApaguei um pod na unha. Em segundos, sem eu mandar nada, um pod novo nasceu no lugar — hash diferente, idade de segundos — enquanto o outro seguia atendendo. O ReplicaSet viu que caiu de duas réplicas pra uma e recriou pra bater o estado desejado. É o coração do Kubernetes: você declara o que quer, ele garante que seja verdade, sempre. Diferente do meu outage de e-SUS, onde caiu e ficou caído até eu agir; aqui cai e se levanta sozinho.\n\nOOMKILLED — ESTOURAR A MEMÓRIA DE PROPÓSITO\nA segunda parte foi forçar o estouro de memória. Descobri primeiro que o deployment não tinha resources declarados — o campo estava vazio. Isso conecta direto com o que aprendi na aula de arquitetura: sem request declarado, o HPA fica cego, mostra TARGETS unknown. Ficou anotado como pré-requisito pro projeto final: declarar resources é obrigatório.\n\nInjetei um limite de memória absurdamente baixo, trinta e dois mega. A aplicação precisa de mais que isso pra subir, então o kernel matou o container no meio da inicialização. A assinatura da falha apareceu no watch: Running por um segundo, OOMKilled, Running, OOMKilled, CrashLoopBackOff. E o describe cravou o diagnóstico — Reason: OOMKilled, Exit Code: 137.\n\nGuardo esse 137 pra vida: é 128 mais 9, onde 9 é o sinal de kill forçado. Quando um pod sai com 137, foi morto por fora, à força — e a causa quase sempre é memória estourada. É a impressão digital do OOM.\n\nO CONTRASTE QUE FECHA A COMPETÊNCIA\nLab 4 e Lab 5 ensinaram dois tipos de falha que se investigam em lugares diferentes. No Lab 4, o Secret corrompido gerou um stack trace nos logs — a aplicação lançou exceção, falha de dentro do código, e o --previous mostrou tudo. No Lab 5, o OOMKilled não deixa stack trace útil: o kernel mata o processo por fora, a app nem tem chance de logar, e o sinal está no describe, no Reason e no exit code, não nos logs. Falha de aplicação versus falha de recurso. Saber onde olhar pra cada uma é o que a competência inteira quis ensinar.\n\nRestaurei removendo o limite absurdo, pods saudáveis subiram, e a Competência 5 fechou.\n\nO QUE FICA\nO que levo desses dois labs não é a mecânica — é a mentalidade. Quebrar de propósito num ambiente seguro ensina mais que qualquer aula, porque quando quebrar de verdade eu já vi o filme. O --previous como primeiro reflexo num CrashLoop. O describe pra separar falha de plataforma de falha de aplicação. Os Golden Signals que não pegam tudo — uma falha de boot só aparece na saturação, e é por isso que alerta de réplica indisponível existe. O exit code 137 como carimbo de memória estourada. E o cluster se curando sozinho, mantendo o estado que eu declarei, sem ninguém acordar de madrugada. Resiliência não é o sistema que não cai — é o sistema que cai e se levanta sem intervenção, e que me deixa investigar com calma quando preciso entrar.",
        tags: ["kubernetes", "k3s", "resiliência", "crashloopbackoff", "oomkilled", "self-healing", "golden signals", "observabilidade", "secrets", "kubectl", "troubleshooting", "grafana", "prometheus", "sre", "movetech"],

        type: "projeto",
        title: "Observabilidade H1 — deploy, logs em JSON e a VM que saturou ao vivo",
        content:
          "Primeiro laboratório da Competência 5 (Observabilidade e Resiliência). O enunciado era direto: subir uma aplicação num cluster K3s, acompanhar os pods, e ler os logs estruturados em tempo real — inclusive provocando um erro de propósito pra ver como ele aparece. Seis passos. O que o roteiro não previa foram os três obstáculos que ensinaram mais que o roteiro em si.\n\nA IDEIA DO LABORATÓRIO\nA aplicação já vinha instrumentada: logs em JSON, e os endpoints /health (que verifica app e banco com um SELECT 1), /stats e /metrics prontos no repositório. Meu trabalho não era escrever observabilidade — era ligar o que já existia. Deploy via GitHub Actions, dois pods atendendo em paralelo, e a promessa de ler cada evento da aplicação conforme ele acontece.\n\nOS CINCO SEGREDOS E O KUBECONFIG QUE PRECISOU DE CIRURGIA\nComo o repositório era novo (criado a partir de template, não fork — assim o Actions já vem habilitado), nada era herdado. Recadastrei os cinco segredos: usuário, senha e nome do registry, a string do banco, e o kubeconfig.\n\nO kubeconfig foi o ponto interessante. O arquivo do K3s aponta o servidor para 127.0.0.1 — funciona dentro da VM, mas o GitHub Actions vem de fora e nunca alcançaria esse endereço. Precisei gerar uma cópia trocando o loopback pelo IP público. E aqui um trabalho meu do passado me salvou: conferi o certificado da API e o IP público já estava na lista de nomes alternativos (TLS-SAN). Quando montei esse cluster, eu já tinha configurado isso — então não houve erro de certificado. O 'eu de semanas atrás' pavimentou o caminho do 'eu de hoje'.\n\nO DEPLOY E A HIPÓTESE DO TRAEFIK\nAntes de disparar, olhei o manifesto e reconheci uma armadilha que já me custou tempo duas vezes: o Service era do tipo LoadBalancer na porta 80. No meu K3s, o Traefik já ocupa a porta 80. Levantei a hipótese na hora: esse serviço vai ficar com IP externo pendente pra sempre.\n\nEm vez de me precaver, decidi deixar rolar e observar — que é a postura certa numa competência de observabilidade. A pipeline fechou verde, os dois pods subiram Running e saudáveis. E o serviço, como previsto: EXTERNAL-IP pendente. Hipótese confirmada.\n\nMas a saída revelou um detalhe que resolveu tudo: mesmo com o LoadBalancer pendente, o K3s já tinha alocado um NodePort — uma porta alta no nó. A aplicação estava acessível pelo IP público da VM naquela porta o tempo todo. Não precisei de contorno nenhum: o curl no /health respondeu status ok e, o mais importante, database ok. A cadeia inteira funcionava — requisição pública, roteamento, pod, e conexão viva com o banco gerenciado.\n\nO EVENTO NO LOG, EM TEMPO REAL\nCom dois terminais lado a lado — um seguindo os logs, outro criando um pedido pela API — veio o momento que o laboratório queria ensinar. Criei um pedido, e no fluxo de logs apareceu a linha exata: um JSON com o evento order_created, o identificador do pedido, o cliente, o nível info e o timestamp. Ação real, observada no instante em que aconteceu, num formato que dá pra filtrar e alertar depois. Impossível com texto livre.\n\nO FILTRO QUE VOLTOU VAZIO\nO passo final era provocar um erro e filtrá-lo. Pedi um pedido inexistente, a API respondeu 404 corretamente. Rodei o comando do roteiro para filtrar só os erros no log — e não veio nada. Vazio.\n\nO filtro estava sintaticamente certo. Então investiguei em camadas, do jeito que essa competência prega. Busquei o texto cru: o log do 404 existia, com o campo de status certo. Testei o filtro por outro campo: funcionou. A diferença entre o comando que funcionou e o que falhou era uma só — a coleta. Sem limitar as últimas linhas, com dois pods despejando um health check a cada dois segundos, o volume de logs de rotina soterrava o evento antes de chegar ao filtro. Adicionei o limite de linhas e o 404 apareceu, indentado e sozinho. Não era o filtro; era o sinal afogado no ruído — exatamente a lição do slide de boas práticas: logar tudo em info esconde o que importa.\n\nDetalhe que me fez rir depois: eu estava usando aquela ferramenta de filtro de JSON sem conhecer o nome dela. Rodei, funcionou, investiguei quando quebrou, e só no fim da aula o instrutor explicou o que era. Aprendi na ordem inversa — a prática antes do conceito. Fixa melhor assim.\n\nO SEGUNDO LABORATÓRIO E A VM QUE NÃO AGUENTOU\nCom o H1 fechado, parti pro H2: instalar o stack de métricas (Prometheus + Grafana + companhia) via Helm, num pacote só. A instalação reportou sucesso. E aí a VM começou a morrer.\n\nO indicador de carga do sistema contava a história: partiu de um valor saudável e disparou para mais de vinte num nó de duas CPUs. Ou seja, uma fila de vinte e poucos processos brigando por dois processadores. A VM ficou lenta, depois travou a ponto de não aceitar mais comandos. O acesso ao cluster passou a estourar timeout de handshake.\n\nO diagnóstico é honesto e vira aprendizado: o stack completo de monitoramento — que faz scrape de tudo, roda exportadores em cada nó e carrega dezenas de painéis — é pesado demais para um nó pequeno que já hospedava a aplicação. Não cabe. É, ironicamente, saturação pura: exatamente o quarto dos Golden Signals que a aula tinha acabado de ensinar, acontecendo ao vivo no meu próprio cluster. O sistema saturou antes de falhar, e eu vi o número subir em tempo real.\n\nA decisão de operação foi parar por ali: desligar a VM para estancar na hora, sem forçar mais nada num nó agonizante. O laboratório de métricas fica pra retomada, com o dimensionamento certo — stack enxuto ou uma VM dedicada só pra observabilidade, que é o padrão correto de qualquer forma: não se mistura o observador com o observado no mesmo nó apertado.\n\nO QUE FICA\nO H1 entregou o que prometia e mais: deploy do commit ao pod, log estruturado lido em tempo real, erro provocado e filtrado. Mas o que vou levar são os três tropeços. O kubeconfig que precisou apontar pro IP público — e o certificado que, graças a um cuidado passado, já reconhecia esse endereço. O LoadBalancer pendente que o NodePort resolveu sozinho. O filtro que voltou vazio não por erro de sintaxe, mas por sinal afogado em ruído. E a lição final, cortesia da própria máquina: observabilidade custa recurso, e um stack de monitoramento mal dimensionado pode derrubar justamente aquilo que ele deveria vigiar. Saturação não é conceito de slide — é o número subindo enquanto você digita.",
        tags: ["kubernetes", "k3s", "observabilidade", "logs", "json", "jq", "prometheus", "grafana", "helm", "traefik", "nodeport", "saturação", "golden signals", "troubleshooting", "github actions", "movetech"],
      },

        type: "projeto",
        title: "Persistência e resiliência: quando o problema não era a aplicação",
        content:
          "O laboratório de hoje tinha um objetivo curto: provar que os dados sobrevivem à morte dos containers. Escrever pedidos pela API, destruir os Pods, esperar o Kubernetes recriá-los e confirmar que nada se perdeu. Seis passos. Levei duas horas — e nenhuma delas foi no roteiro.\n\nA IDEIA DO LABORATÓRIO\nPod é volátil por natureza. Ele morre, é recriado, muda de IP, e nada do que estava no sistema de arquivos dele sobrevive. Por isso o estado precisa morar fora: num banco gerenciado, que tem ciclo de vida próprio.\n\nO teste é simples de enunciar e brutal quando falha: cria dois pedidos, apaga os Pods, espera o self-healing, consulta de novo. Se os mesmos IDs voltarem, a persistência está correta. Se sumirem, a aplicação estava gravando em algum lugar efêmero.\n\nO material previa inclusive o modo de falha: se a variável de conexão não chegar ao container, a aplicação cai num banco local em memória. Ela continua respondendo, devolve IDs, parece saudável — e perde tudo no primeiro reinício. É o pior tipo de falha, a que não faz barulho.\n\nO PLACEHOLDER QUE VIROU SENHA\nComecei recadastrando os segredos, porque o laboratório usa um repositório novo e nada é herdado do anterior. Cadastrei os cinco pela linha de comando e disparei a pipeline. Verde de ponta a ponta.\n\nOs Pods novos entraram em CrashLoopBackOff. O log foi direto ao ponto: falha de autenticação para o usuário do banco. Estranho, porque eu tinha acabado de testar aquela mesma credencial no cliente de linha de comando e ela funcionava.\n\nDecodifiquei o segredo dentro do cluster e a resposta apareceu: a string de conexão continha a palavra SENHA, literalmente. Eu tinha copiado o comando com o placeholder e não substituído. A aplicação estava tentando autenticar com a palavra 'SENHA' como senha.\n\nDetalhe que me fez rir: os Pods antigos continuavam funcionando, porque tinham carregado o segredo correto no dia anterior. Pod não relê segredo depois de iniciado — variável de ambiente é injetada uma vez, no start. Metade do cluster com credencial boa, metade com credencial de mentira.\n\nO FANTASMA — DUAS HORAS ATRÁS DE UM ERRO QUE NÃO EXISTIA\nCorrigido o segredo, comecei o laboratório de verdade. E aí começou a parte que ensinou.\n\nCriei um pedido. A API devolveu 201 e um identificador. Consultei a listagem: o pedido estava lá. Fui conferir no banco: zero linhas.\n\nCriei outro pedido. A listagem agora mostrava o primeiro, mas não o segundo. Depois mostrava três, de horários diferentes, incluindo um de antes do último deploy. O banco continuava vazio.\n\nEsse padrão — resultados que aparecem e somem conforme a requisição — é assinatura de estado local com múltiplas réplicas. Cada Pod tem sua própria cópia dos dados, e o balanceador reparte as chamadas. Você escreve num, lê do outro. Foi exatamente o que eu já tinha provado no meu projeto de e-commerce com upload de imagem: com três réplicas, a foto salva em um dos três pods.\n\nO problema é que a explicação óbvia não se sustentava. Verifiquei a variável de ambiente dentro dos containers: apontava para o PostgreSQL, correta. Abri uma conexão manual de dentro do Pod: funcionou, retornou o nome do banco. Li o código que monta a conexão: nenhum fallback silencioso, nenhum tratamento de exceção engolindo erro. Li o endpoint de escrita: sessão do banco, add, commit, tudo certo.\n\nTudo indicava que a aplicação gravava no PostgreSQL. E o PostgreSQL estava vazio.\n\nA VIRADA — LISTAR O QUE NÃO É SEU\nQuando as hipóteses sobre a aplicação se esgotam, o problema está no caminho até ela. Listei todos os serviços e rotas do cluster, em todos os namespaces — não só os meus.\n\nApareceu um Ingress do laboratório anterior, criado dois dias antes, num namespace separado, com host coringa. Host coringa significa: captura qualquer requisição que chegue na porta 80, independente do domínio. Ele apontava para a API antiga — que roda com banco local.\n\nNenhuma das minhas requisições tinha chegado na aplicação nova. Todas foram desviadas para a API do laboratório passado, que gravava em arquivo local, em duas réplicas, cada uma com sua cópia. Por isso os resultados intermitentes. Por isso o banco vazio. A aplicação nova estava perfeita o tempo todo, esperando um tráfego que nunca chegou.\n\nO ERRO DE ARQUITETURA POR TRÁS DISSO\nHavia um segundo sintoma que eu tinha ignorado: o serviço da aplicação estava como LoadBalancer com endereço externo pendente há 24 horas. Achei que fosse limitação do cluster leve e segui em frente.\n\nEra a mesma causa. No K3s, o balanceador embutido tenta reservar a porta no host. Mas o Traefik, que vem instalado por padrão, já ocupa a porta 80. O pod responsável por essa reserva ficava eternamente pendente, sem conseguir a porta.\n\nA arquitetura correta nesse ambiente é a que o próprio material indica e que eu já tinha usado no laboratório de deploy: serviço interno mais Ingress, deixando o Traefik fazer o roteamento. Criei o Ingress apontando para a aplicação nova e o primeiro pedido caiu no PostgreSQL na hora.\n\nO TESTE QUE O LABORATÓRIO PEDIA\nCom o caminho corrigido, o laboratório em si levou três minutos. Dois pedidos criados, identificadores anotados. Apaguei os Pods. O Kubernetes recriou os dois — self-healing sem nenhuma intervenção. Consultei a listagem: os mesmos identificadores, os mesmos clientes, os mesmos horários de criação.\n\nCritério de aceite cumprido. Os dados sobreviveram porque nunca estiveram nos containers.\n\nO QUE FICA\nO laboratório queria ensinar que estado não mora no Pod. Acabou ensinando outra coisa, mais útil: recurso órfão de laboratório anterior sabota o seguinte, silenciosamente.\n\nDuas lições que vou levar. A primeira: quando todas as hipóteses sobre a aplicação se esgotam e o comportamento continua impossível, o problema está no caminho até ela — e é hora de listar recursos em todos os namespaces, não só nos seus. A segunda: sintoma que você decide ignorar volta. O endereço externo pendente estava ali desde ontem, apontando para a mesma causa raiz, e eu classifiquei como limitação do ambiente em vez de investigar.\n\nE a de sempre, que já custou tempo duas vezes: conferir se o placeholder virou valor de verdade antes de cadastrar um segredo.\n\nHigiene ao final: namespace antigo removido, recursos desligados.",
        tags: ["kubernetes", "k3s", "persistência", "postgresql", "dbaas", "ingress", "traefik", "troubleshooting", "self-healing", "secrets", "movetech"],

        title: "DBaaS e injeção de segredos: sete obstáculos, um documentado",
        content:
          "O laboratório de hoje tinha um enunciado simples: provisionar um PostgreSQL gerenciado na nuvem e conectar uma API a ele sem que a credencial encostasse no código. Seis passos no roteiro. Sete obstáculos na prática — e só um deles estava previsto no material.\n\nA IDEIA CENTRAL — CADEIA DE CUSTÓDIA DO SEGREDO\nO problema que o lab resolve é antigo: uma aplicação precisa da senha do banco. O jeito errado é escrever a senha no código ou no manifesto — e aí ela vaza no Git, nos logs, no histórico, para sempre. O jeito certo tem três saltos.\n\nGuardar: a string de conexão vai para os secrets do repositório no GitHub, criptografada em repouso e nunca impressa nos logs da pipeline.\nTraduzir: a pipeline lê esse segredo e cria um Secret do Kubernetes no cluster, em tempo de deploy.\nConsumir: o Deployment referencia o Secret pelo nome e pela chave (secretKeyRef) e o pod recebe a variável de ambiente pronta, sem saber de onde ela veio.\n\nA prova de que funcionou é negativa: dá para abrir o manifesto no repositório público e não encontrar senha nenhuma — só o nome do Secret. O valor nunca esteve ali.\n\nO PADRÃO IDEMPOTENTE\nO comando que cria o Secret na pipeline merece atenção. O create puro do kubectl falha se o recurso já existe — o que quebraria a pipeline na segunda execução. A solução é gerar o YAML sem aplicar (--dry-run=client -o yaml) e mandar o resultado para o apply, que cria ou atualiza indiferentemente. Roda mil vezes, mesmo resultado. É a lógica declarativa do GitOps aplicada dentro de um passo imperativo.\n\nOBSTÁCULO 1 — A PORTA DA API DO KUBERNETES\nO cluster era um K3s numa VM própria, não o gerenciado. Para a pipeline do GitHub alcançar a API do Kubernetes, a porta 6443 precisa estar aberta no Security Group — e não estava. O diagnóstico foi em camadas: primeiro conferir se a regra existe no firewall, depois entrar na VM e verificar com ss se o serviço realmente escuta naquela porta, por fim testar de fora com nc. Cada camada elimina uma hipótese. Sem esse método, o timeout genérico não diz nada.\n\nOBSTÁCULO 2 — O CERTIFICADO QUE NÃO CONHECE O PRÓPRIO IP (TLS-SAN)\nEste é o mais interessante e vale para qualquer pessoa rodando K3s em VM na nuvem. Com a porta aberta, o erro mudou: x509, certificado válido para os IPs internos, não para o IP público.\n\nO motivo é elegante. O K3s gera o certificado da API na primeira inicialização, listando apenas os endereços que o sistema operacional enxerga: loopback, interface interna, IP de cluster. O IP público é NAT feito pela plataforma de nuvem — a VM nunca o vê, então ele jamais entra no certificado sozinho. Quem acessa de dentro da VM não percebe nada. Quem acessa de fora bate no erro.\n\nA correção é declarar o endereço público como TLS-SAN na configuração do K3s e reiniciar o serviço para regenerar o certificado. Existe um atalho: desligar a verificação TLS no kubeconfig. Não usei — desativar a validação de identidade do servidor abre porta para man-in-the-middle, e o ganho seria de trinta segundos. Em produção, o correto seria emitir o certificado para um hostname DNS em vez de um IP: assim ele sobrevive a uma troca de endereço.\n\nOBSTÁCULO 3 — SINTAXE QUEBRADA NO TEMPLATE\nO repositório-modelo trazia o campo build-backend declarado como lista quando o valor tem que ser string. O job de testes quebrava na instalação de dependências e, como o job de deploy depende do de testes, nada acontecia depois. O instrutor corrigiu no repositório original durante a aula, mas o template ainda servia a versão antiga.\n\nOBSTÁCULO 4 — O BANCO NÃO NASCE COM A INSTÂNCIA\nO roteiro manda definir o 'nome do banco' na tela de criação. Mas o formulário do console só tem campo para o nome da instância — não existe campo para o database. Provisionei, conectei via psql e recebi: database does not exist.\n\nO detalhe que mais ensinou foi a sequência de erros. A tentativa anterior tinha retornado falha de autenticação; quando a mensagem mudou para 'database não existe', isso já provava que usuário e senha estavam corretos. Erro que muda é erro que avança — vale mais que um erro genérico repetido. Um CREATE DATABASE resolveu.\n\nOBSTÁCULO 5 — CREDENCIAL DO REGISTRY AUSENTE\nOs pods subiram em ImagePullBackOff: o cluster não tinha credencial para baixar a imagem do registro privado. Já tinha visto esse erro no laboratório anterior, mas por outro motivo (namespace errado). Desta vez faltavam duas coisas: o Secret do tipo docker-registry no cluster e a referência a ele no Deployment via imagePullSecrets. Resolvi criando o Secret dentro da própria pipeline, e não à mão — passo manual é passo que alguém esquece.\n\nOBSTÁCULO 6 — FUNCIONOU POR ACIDENTE\nEsse é o que mais me fez parar. Os pods subiram e a API respondeu, mas o Secret do registry que o manifesto pedia não existia no cluster. A explicação: o nó ainda tinha a imagem em cache de um build anterior, então nem precisou autenticar. O nome do Secret criado pela pipeline e o nome exigido pelo manifesto eram diferentes.\n\nTeria sido fácil comemorar e seguir. Mas 'funciona e não sei por quê' é dívida técnica com juros: num cluster limpo, sem cache, aquilo quebraria. Alinhar os dois nomes e forçar a recriação dos pods foi o que transformou sorte em resultado reprodutível.\n\nOBSTÁCULO 7 — COMMIT SEM PUSH\nO mais barato de evitar e o mais constrangedor. Editei a pipeline, commitei, disparei o workflow — e o GitHub rodou a versão antiga do arquivo, que ainda estava só na minha máquina. O git status avisava desde o começo: ramo à frente da origem por uma submissão. A lição cabe numa linha: conferir git status antes de disparar qualquer pipeline.\n\nSOBRE O BANCO GERENCIADO\nA instância veio com endereço privado e sem hostname público. Isso confirma o padrão que eu já tinha observado antes: o DBaaS da plataforma roda na rede gerenciada dela, não anexado à VPC do cliente. O acesso vem de máquinas da mesma região pela rede interna — não foi preciso liberar regra de acesso nenhuma.\n\nA validação foi em camadas, de novo: primeiro nc para confirmar que a porta respondia, depois psql para separar credencial de database, só então montar a string de conexão completa. Quando o pod subir e falhar, você já sabe que não é rede nem senha. Descartar hipóteses antes de precisar delas economiza mais tempo do que qualquer atalho.\n\nO ELO COM A AULA ANTERIOR\nA aula de ontem foi sobre ORM — classes Python que viram tabelas, com chaves, restrições e estratégias de carregamento declaradas em código. Os endpoints de pedidos e itens que apareceram na documentação da API são exatamente aquelas classes. Ontem vi o modelo; hoje ele ganhou um banco gerenciado de verdade para morar. Os dois labs são o mesmo assunto em tempos diferentes.\n\nO RESULTADO\nDuas réplicas em execução, zero reinícios, endpoint de saúde respondendo 200 e a documentação OpenAPI acessível publicamente. O endpoint de saúde só responde se a conexão com o banco estiver de pé — ele é a prova de que a cadeia inteira funcionou, do secret no GitHub até a consulta no PostgreSQL.\n\nO QUE FICA\nSeis dos sete obstáculos não estavam no roteiro. O laboratório ensina injeção de segredos; o resto ensinou a diagnosticar em camadas, a desconfiar quando algo funciona sem explicação, e a lembrar que a diferença entre um erro e outro já é informação. E, como sempre, a higiene no fim: recursos desligados depois que a demonstração cumpriu seu papel.",
        tags: ["dbaas", "postgresql", "kubernetes", "k3s", "github actions", "secrets", "tls", "ci/cd", "container registry", "troubleshooting", "movetech"],
      },      
      {
        id: 29,
        date: "2026-07-21",
        type: "estudo",
        title: "Publicando uma API REST na nuvem (K3s) e documentando o schema",
        content:
          "Dois laboratórios em sequência: o primeiro leva uma API REST do código no GitHub até rodar publicamente num cluster Kubernetes na nuvem; o segundo é sobre modelar e documentar o banco dessa mesma API. Um é infraestrutura pura, o outro é a disciplina de deixar o modelo de dados registrado. Juntos, mostram as duas pontas de um projeto real.\n\nLAB 1 — DO COMMIT AO ENDPOINT: API REST NO K3s\nO objetivo era percorrer a cadeia inteira de publicação: código, build automatizado, registro da imagem, deploy no cluster e API acessível pelo navegador. O cluster aqui não foi o gerenciado, e sim o K3s — um Kubernetes leve, instalado do zero numa VM com um único comando. É o tipo de cluster 'na raça', que ajuda a entender o que existe embaixo do kubectl (e é o formato cobrado na CKA).\n\nA esteira de CI/CD (GitHub Actions) fez o trabalho pesado: a cada push, valida, constrói a imagem e publica no Container Registry privado da nuvem. Detalhe de segurança que se repete e vale fixar: as credenciais do registry vão como secrets do GitHub, nunca no código; só usuário e senha são segredo, o resto (endereço, região) é endereçamento e vai em texto plano.\n\nFORK vs 'USE THIS TEMPLATE' — UM APRENDIZADO QUE CUSTOU TEMPO\nNo primeiro lab usei fork do repositório do curso. Ao tentar rodar a pipeline, o GitHub bloqueou: quando se forka um repo que já contém workflows, o Actions vem desabilitado por segurança — é preciso clicar num botão de confirmação para habilitar. Descobri isso na prática, com a pipeline parada.\nA lição: fork cria uma cópia vinculada ao original (histórico compartilhado, Actions desligado por padrão); 'Use this template' cria uma cópia independente (histórico limpo, Actions já habilitado). Para labs onde a pipeline precisa disparar de cara, template evita a fricção. No lab seguinte, já usei template de propósito.\n\nO DEPLOY NO CLUSTER — E A PEGADINHA DO SECRET DE REGISTRY\nCom a imagem publicada, veio a segunda metade: aplicar os manifests no K3s. Os pontos que mais ensinaram:\n\nSecret de registry preso ao namespace. O cluster precisa autenticar no registro privado para baixar a imagem — um secret do tipo docker-registry. Ele tem que ser criado no mesmo namespace do Deployment; criado no lugar errado, o pod não encontra a credencial e cai em ImagePullBackOff.\n\nO Deployment precisa referenciar o secret. Não basta o secret existir — o manifesto tem que apontar para ele via imagePullSecrets. Faltando essa linha, mesmo com o caminho certo, dá ImagePullBackOff de novo. Além disso, o endereço da imagem tinha que bater exatamente com o nome do meu registro (o material vinha com um nome de exemplo — trocar pelo do próprio ambiente é parte do trabalho).\n\nClusterIP + Ingress, não LoadBalancer. Aqui o Service é ClusterIP (interno) e quem expõe para fora é o Ingress (Traefik, que já vem no K3s, na porta 80). Num nó único, subir um LoadBalancer na 80 conflitaria com o Traefik que já ocupa a porta — por isso o padrão Ingress é o correto.\n\nA porta no firewall. A velha regra: de dentro da VM o curl localhost/health respondeu na hora, mas no navegador não abria — faltava liberar a porta 80 no Security Group (só a de SSH estava aberta). Aberta a porta, a API respondeu publicamente.\n\nO CLÍMAX: /docs GERADO SOZINHO (CODE-FIRST)\nCom tudo no ar, a documentação interativa da API (Swagger, na rota /docs) abriu no navegador — com os endpoints listados e a opção de testar cada um ao vivo. E um conceito ficou concreto: essa documentação não foi escrita à mão. O FastAPI a gera automaticamente a partir do código. Isso é code-first: escreve-se o código e o contrato da API nasce dele — o oposto do design-first, onde o contrato vem primeiro e o código depois. Cada abordagem tem seu contexto: design-first brilha em times grandes que precisam do contrato acordado antes; code-first é ágil e imediato.\n\nLAB 2 — MODELANDO E DOCUMENTANDO O SCHEMA\nO segundo lab troca a infraestrutura pela modelagem de dados: analisar como as tabelas são declaradas em código (SQLAlchemy, mapeamento objeto-relacional) e escrever a documentação técnica oficial do banco, versionada no Git junto do projeto.\n\nO modelo tem duas tabelas, orders e items, e três pontos que resumem o relacional:\nChave primária: em ambas é a coluna id, inteira e auto-incrementada — o identificador único de cada linha.\nChave estrangeira: items.order_id aponta para orders.id, com NOT NULL — todo item pertence obrigatoriamente a um pedido. É a relação 1:N (um pedido, muitos itens).\nCascata: a regra cascade='all, delete-orphan' faz com que, ao apagar um pedido, todos os seus itens sejam removidos automaticamente. Evita registros órfãos — item apontando para um pedido que não existe mais.\n\nA entrega foi um documento docs/data-model.md descrevendo cada tabela, coluna, tipo, restrição e o relacionamento — e um Pull Request seguindo o padrão de descrição estruturada (descrição, tipo de alteração, o que mudou, como foi testado, links). Documentar o modelo no mesmo repositório do código, versionado, é 'documentation as code': a doc acompanha o projeto e evolui com ele.\n\nO QUE FICA DOS DOIS\nO primeiro lab prova que domino o caminho de publicação de uma aplicação na nuvem — do commit ao endpoint público, com CI/CD, registro privado, cluster e roteamento. O segundo mostra a outra metade que muita gente pula: registrar o modelo de dados de forma clara e versionada. Um sem o outro é entrega pela metade. E, como sempre, a higiene ao final: cluster e VM desligados, sem recurso sangrando crédito depois que a demonstração cumpriu seu papel.",
        tags: ["kubernetes", "k3s", "ci/cd", "github actions", "container registry", "fastapi", "ingress", "traefik", "code-first", "sqlalchemy", "modelagem de dados", "documentação", "movetech"],
      },

      {
        id: 28,
        date: "2026-07-18",
        type: "estudo",
        title: "Grande Final (tarde) — o mesmo stack rodando de verdade na Magalu (com debug e faxina)",
        content:
          "CONTEXTO\nDepois de validar toda a arquitetura Kubernetes localmente no kind, chegou a hora do ensaio na nuvem: subir o mesmo stack na Magalu Cloud, com cluster gerenciado e banco de dados real, provar que funciona ponta a ponta, e derrubar tudo com disciplina de custo. A filosofia de sempre: primeiro local, depois nuvem. A máquina já tinha provado que a arquitetura era sólida; a nuvem só precisava confirmar.\n\nO QUE SUBIU\n- Imagem da aplicação (Chainguard, ~46MB, 0 CVE) publicada no Container Registry privado.\n- Cluster Kubernetes gerenciado (MKE), 4 nós, na mesma região do banco (pré-requisito pra rede interna alcançar o DBaaS).\n- Dois segredos criados diretamente no cluster, FORA do Git: as credenciais do banco e a autenticação no registry privado. Nenhum tocou o repositório — o único arquivo versionado é um template de exemplo com placeholders.\n- ArgoCD instalado via Helm, fazendo GitOps: ele puxa os manifests de uma branch de produção e sincroniza o cluster sozinho.\n- Branch separada pra produção (imagem do registry + autenticação ativa), enquanto a branch principal fica com a versão de teste local. Ambientes diferentes, branches diferentes, mesma estrutura.\n\nO DEBUG (onde mais se aprende)\nNo primeiro sync, os pods do app entraram em CrashLoopBackOff — subiam e morriam em loop. O ArgoCD estava perfeito (sincronizado, verde); o problema era a aplicação não bootar. Fui atrás do log.\n\nO topo do traceback entregou a causa raiz: o driver do PostgreSQL falhava tentando 'resolver o host' com um endereço estranho, tipo '4@IP_PRIVADO_BANCO' — um pedaço da senha grudado no IP. O gunicorn só reportava 'Worker failed to boot', que era o sintoma; a causa estava na primeira exceção, bem acima.\n\nO diagnóstico: a senha do banco tinha um caractere '@' no meio. A string de conexão é uma URL (usuario:senha@host:porta/banco), e o parser via o '@' da senha como o separador entre credencial e host — quebrando tudo. Um clássico de connection string que só aparece quando a senha tem caractere especial.\n\nA correção certa (não a preguiçosa): em vez de trocar a senha por uma 'sem caractere chato', ensinei o código a lidar com qualquer senha, fazendo o URL-encode dela antes de montar a string de conexão. Porque banco de produção real TEM senha com caractere especial — o código é que precisa estar preparado. Nova versão da imagem, push, atualização da tag no manifest, commit. E aí a beleza do GitOps: não rodei nenhum comando de deploy manual. Só commitei a tag nova, o ArgoCD detectou, puxou e fez o rolling update sozinho — trocando os pods quebrados pelos corrigidos. Os pods ficaram verdes.\n\nA PROVA\nApp no ar num IP público real. O health check respondendo, o endpoint de status mostrando os três pods se revezando (load balancing visível via contador no Redis), e — o teste que fecha tudo — pedidos criados pela interface PERSISTINDO no banco gerenciado: recarreguei e continuavam lá. A stack inteira funcionando: entrada pública, balanceamento entre réplicas, e dados salvos no DBaaS. Não é exercício; é aplicação em produção numa nuvem brasileira.\n\nA FAXINA (tão importante quanto subir)\nCluster gerenciado, LoadBalancer e banco ligado sangram crédito por hora. Provado o que precisava, veio a limpeza — e aqui mora um aprendizado de FinOps que vale ouro: o LoadBalancer é o inimigo número um. Na plataforma, ele NÃO morre automaticamente junto com o cluster; fica pra trás, cobrando sozinho, com o IP público reservado. A regra de ouro da faxina: depois de deletar o cluster, SEMPRE conferir a lista de LoadBalancers e garantir que voltou vazia. Segui um checklist sistemático: deletar cluster, caçar LoadBalancer órfão, soltar IP público reservado, conferir volumes de disco, e parar (não deletar) o banco — mantendo os dados e a proteção contra exclusão. Item por item, confirmando cada morte, até a conta voltar ao custo mínimo.\n\nCONCEITOS CONSOLIDADOS\n- O que roda no kind roda no cluster gerenciado sem mudança — Kubernetes é Kubernetes. Validar local elimina quase toda surpresa na nuvem.\n- Segredo nunca no Git: credenciais criadas direto no cluster, fora do escopo do GitOps; versiona-se só um template de exemplo.\n- Connection string é URL: senha com caractere especial precisa de URL-encode, senão o parser quebra. Corrige-se no código, não trocando a senha.\n- Ler log de baixo pra cima engana: num CrashLoopBackOff, o sintoma (worker não bootou) fica embaixo; a causa raiz (erro de conexão) fica no topo da primeira exceção.\n- GitOps de verdade: deploy é um commit. Mudei a tag da imagem no Git, o operador puxou e aplicou sozinho. Nenhum comando manual no cluster.\n- Cloud hygiene / FinOps: recurso órfão (LoadBalancer, IP reservado) é cobrança fantasma. Faxina com checklist é parte do trabalho, não um extra. Parar o banco preserva dados; deletar apaga.\n\nO que ainda falta pro pacote completo: CDN na frente pras imagens, evolução do app com upload de imagens de produto no Object Storage, esteira de CI com scanners de segurança, e políticas de cluster. Mas o coração do grande final já bateu em produção.",
        tags: ["kubernetes", "mke", "argocd", "gitops", "dbaas", "troubleshooting", "finops", "cloud hygiene", "magalu cloud", "devops", "grande final", "movetech"]
      },
      {
        id: 27,
        date: "2026-07-18",
        type: "estudo",
        title: "Grande Final (manhã) — validando a arquitetura K8s local no kind antes de gastar nuvem",
        content:
          "CONTEXTO\nAntes de subir o projeto final na Magalu Cloud e gastar crédito, decidi validar a arquitetura Kubernetes inteira na minha própria máquina, num cluster kind (Kubernetes in Docker). A filosofia é a de sempre: a nuvem confirma, não depura. Se algo estiver errado nos manifests, é infinitamente mais rápido e barato descobrir local do que num cluster gerenciado cobrando por hora. Montei a pasta de manifests, subi tudo no kind e só vou pra Magalu quando cada peça estiver comprovadamente funcionando.\n\nA ARQUITETURA MONTADA\nCinco manifests, aplicados em ordem (o Secret precisa existir antes do Deployment que o consome):\n1. Secret — credenciais do banco (PostgreSQL), fora do código e fora da imagem, injetadas como variáveis de ambiente. Placeholders no arquivo versionado; valores reais nunca commitados.\n2. Redis — Deployment + Service (ClusterIP, nunca exposto). Serve só de contador de hits por pod, pra demonstrar visualmente o balanceamento. Se cair, o app segue funcionando (degradação graciosa): perde o contador, nunca os pedidos.\n3. Deployment do app — imagem Chainguard v4.0 (~46MB, zero CVE, roda nonroot), 3 réplicas, com resources.requests.cpu (obrigatório pro autoscaling calcular a porcentagem) e as duas probes de saúde.\n4. Service LoadBalancer — ponto de entrada estável, distribui tráfego entre as réplicas prontas.\n5. HPA — HorizontalPodAutoscaler, mínimo 3, máximo 10 pods, alvo de 50% de CPU.\n\nO ENDPOINT QUE FALTAVA\nO app não tinha uma rota de health check dedicada. Adicionei um /health mínimo, de propósito leve: não consulta banco nem Redis, só confirma que o processo está de pé respondendo HTTP. A razão é uma decisão de arquitetura que vale ouro: a liveness probe (que reinicia o container quando falha) não deve depender do banco — se o PostgreSQL cair, não quero o Kubernetes reiniciando pods sadios em loop, porque reiniciar não conserta banco caído. Liveness reflete 'o processo está vivo', não 'as dependências estão ok'.\n\nOS PULOS DO GATO NO KIND\n- metrics-server: o HPA não funciona sem ele, e no kind ele precisa do parâmetro --kubelet-insecure-tls pra ignorar o TLS do kubelet local. Sem isso, o HPA fica eternamente mostrando <unknown> no lugar da CPU.\n- Banco de teste: como o DBaaS da Magalu não existe local, subi um PostgreSQL simples dentro do próprio cluster, com credenciais batendo com o Secret.\n- LoadBalancer pending: no kind o Service tipo LoadBalancer fica com IP externo <pending> pra sempre (não há nuvem pra provisionar IP). Isso é esperado — o acesso local se faz por port-forward.\n\nO CLÍMAX — três provas ao vivo\n1. Load balancing visível: abri o endpoint /info e dei refresh várias vezes. O campo 'pod' alternava entre as três réplicas, e o contador de hits do Redis crescia distribuído entre elas. Prova visual de que o Service espalha o tráfego e de que o estado compartilhado (Redis) funciona.\n2. Autoscaling sob carga: gerei carga batendo no /info em loop e assisti o HPA reagir em tempo real. A CPU disparou pra quase 200%, e o autoscaler escalou de 3 para 6 e depois para 10 pods (respeitando o teto configurado). Com 10 pods dividindo o trabalho, a CPU por pod despencou de volta pra perto dos 50% do alvo. Exatamente o comportamento esperado. Detalhe aprendido: a subida do HPA é rápida, mas a descida é lenta de propósito (janela de estabilização), pra evitar ficar criando e destruindo pods a cada oscilação de tráfego.\n3. Auto-cura: matei um pod na mão e um novo nasceu sozinho em segundos, pra manter as 3 réplicas declaradas. O site nunca saiu do ar, porque os outros pods atenderam enquanto o Kubernetes recriava o que morreu.\n\nCONCEITOS CONSOLIDADOS\n- Validar local antes da nuvem economiza dinheiro e tempo: erro de manifest se acha em segundos no kind, não lendo log de cluster remoto.\n- Ordem de aplicação importa: recursos que dependem de outros (Deployment depende do Secret) precisam ser aplicados na sequência certa.\n- resources.requests.cpu é pré-requisito do HPA por CPU — sem ele, não há base pra calcular a porcentagem de uso.\n- Liveness vs Readiness: liveness reinicia o container (saúde do processo); readiness controla se o pod recebe tráfego (capacidade de atender). Health check de liveness deve ser leve e não depender de banco.\n- LoadBalancer pending no kind é normal — só a nuvem provisiona IP externo; local usa port-forward.\n- metrics-server no kind exige --kubelet-insecure-tls, senão o HPA fica cego.\n\nPRÓXIMO PASSO\nCom a arquitetura validada local, o caminho pra Magalu fica limpo: trocar a imagem local pela do Container Registry, reativar o imagePullSecret, apontar o Secret pro DBaaS real, e subir. A nuvem vai só confirmar o que a minha máquina já provou. Depois vêm as camadas de evolução: pipeline com gates de segurança, GitOps e políticas de cluster.",
        tags: ["kubernetes", "kind", "hpa", "autoscaling", "probes", "load balancing", "secret", "chainguard", "cka", "grande final", "movetech"]
      },
      {
        id: 26,
        date: "2026-07-16",
        type: "estudo",
        title: "Noite de guerra — prova gabaritada e uma cadeia de troubleshooting em produção",
        content:
          "CONTEXTO\nDia de prova do Movetech (Arquitetura e Serviços em Cloud) e, logo depois, uma sequência de problemas reais no meu próprio blog que virou a melhor aula prática de infraestrutura AWS que eu podia pedir. Registro aqui porque quase nada disso estava no material do curso — foi tudo troubleshooting de produção, do tipo que só se aprende quando quebra.\n\nA PROVA — 35/35\nProva de 35 questões de múltipla escolha cobrindo armazenamento, CDN, backup, RPO, DBaaS, containers, Container Registry, Kubernetes, resiliência, exposição de aplicações e migração multicloud. Gabarito completo. Duas questões que fixei de vez: a diferença entre Readiness Probe (controla se o pod recebe tráfego — falhou, sai do balanceamento, ninguém reinicia) e Liveness Probe (controla se o pod está saudável — falhou repetido, o container é reiniciado). E a arquitetura completa de um e-commerce em Kubernetes: Deployment multi-réplica + DBaaS + Object Storage + Service LoadBalancer + Readiness Probe — que é, não por acaso, exatamente o desenho do meu projeto final.\n\nDEPOIS DA PROVA, A GUERRA (todas as paradas da noite)\nCom a cabeça ainda quente, resolvi mexer no blog — e cada mexida abriu um problema novo, numa cadeia que só terminou de madrugada. Cada elo ensinou algo.\n\n1. PIPELINE DE DEPLOY MORTA (o resgate mais difícil)\nO CodePipeline que publica o blog parou de funcionar, falhando na etapa Source com um InternalError genérico — daqueles que não dizem a causa. Depois de descartar hipóteses (não era tamanho de arquivo, não era o commit, não era incidente transitório), a raiz apareceu: a conexão com o GitHub usava o método OAuth antigo (v1), que é deprecado e instável. A solução foi migrar para o método moderno via GitHub App (CodeConnections v2). Mas aí surgiu um segundo erro, agora claríssimo: 'The provided role does not have sufficient permissions'. A role do pipeline sabia falar com o storage, com a função de invalidação e com os logs, mas não tinha permissão para USAR a conexão nova. Adicionei uma policy inline concedendo a ação de usar aquela conexão específica, e o pipeline voltou a verde. Lição de ouro: 'por que a pipeline falha?' muitas vezes não é código — é IAM, é permissão faltando no ator que executa. Mesma lógica do Secret do registry no Kubernetes: o ator precisa de credencial explícita para alcançar o recurso.\n\n2. LINKS DE SUBPASTA DANDO ACESSO NEGADO\nAs páginas do blog abriam por caminho completo (/pasta/index.html) mas davam AccessDenied pelo caminho amigável (/pasta/). Diagnóstico: a origem da CDN apontava para o endpoint REST do storage, que serve arquivos por caminho exato e não sabe transformar /pasta/ em /pasta/index.html. A correção definitiva foi uma CloudFront Function — uma função de borda de poucas linhas que intercepta cada requisição e, quando a URL termina em barra (ou não tem extensão), acrescenta o index.html. Testei o comportamento antes de publicar, associei ao viewer request da distribuição, e os caminhos amigáveis voltaram a funcionar. Solução reversível num clique — o que dá segurança para mexer em infra sem medo.\n\n3. SINCRONIZAÇÃO É DONA DA VERDADE\nUm aprendizado que atravessou a noite: joguei uns arquivos direto no storage pela mão, e quase apanhei disso — a pipeline sincroniza o bucket com o repositório Git, então arquivo que existe só no storage e não no Git pode ser apagado no próximo deploy. É a mesma filosofia do GitOps que estudei essa semana: o Git é a fonte da verdade, e a infraestrutura se reconcilia para corresponder a ele. Regra que fica: nada de arquivo na mão em produção — tudo pelo repositório.\n\n4. AS MELHORIAS QUE SOBREVIVERAM\nNo meio do caos ainda saíram melhorias de verdade: ícones de app (PWA) próprios para quando o blog é instalado na tela inicial do celular, um manifesto web para o mesmo fim, e correções de responsividade no cabeçalho para telas pequenas. Detalhe de front que aprendi na marra: media query duplicado em dois arquivos diferentes gera conflito — a correção certa foi consolidar o cabeçalho responsivo num único lugar (o CSS global), não espalhar.\n\nCONCEITOS CONSOLIDADOS\n- Readiness vs Liveness: readiness roteia tráfego; liveness ressuscita o container. Macete que não esqueço mais.\n- InternalError genérico em pipeline de nuvem quase sempre esconde uma causa que o provedor não expõe — o caminho é isolar por eliminação, não adivinhar.\n- OAuth v1 para GitHub é deprecado; conexão via App (v2) é o padrão atual e mais estável.\n- Permissão do executor: pipeline, cluster ou função só faz o que a identidade dele tem permissão explícita para fazer. Negação por padrão, permissão explícita — o mesmo princípio do Security Group e do Secret de registry.\n- Endpoint REST vs website do storage: o REST serve caminho exato; caminhos amigáveis (/pasta/) exigem reescrita, resolvida elegantemente por uma função de borda na CDN.\n- Fonte da verdade é o Git: infraestrutura se reconcilia com o repositório, não o contrário.\n\nPor que registro uma noite de problemas\nPorque foi aqui que mais aprendi. Gabaritar a prova valida o que eu já sabia; resgatar a pipeline, decifrar o IAM, escrever uma função de borda e entender por que os caminhos quebravam me ensinou o que eu ainda não sabia. Terminei a noite com o blog no ar, mais robusto, e com uma bagagem de troubleshooting de infraestrutura de verdade — o tipo de coisa que não cai em prova, mas define quem opera uma plataforma.",
        tags: ["troubleshooting", "aws", "cloudfront", "codepipeline", "iam", "ci/cd", "gitops", "cloud", "devops", "prova", "movetech"]
      },

        title: "CI de verdade — git push vira imagem publicada na Magalu Cloud",
        content:
          "CONTEXTO\nAula do Módulo DevOps (H3 — Automatizar Deploy) com laboratório de 10 missões: construir uma esteira de Integração Contínua com GitHub Actions publicando imagens Docker automaticamente no Container Registry da Magalu Cloud. O slide da aula resumiu bem a dor que a esteira resolve: publicar manualmente é lento, cheio de etapas e cada release abre espaço pra erro humano. A pipeline dispara no push, testa, constrói e publica sozinha — do commit à produção.\n\nO CAMINHO (10 MISSÕES)\n1. Container Registry criado na Magalu via CLI (mgc container-registry registries create) e credenciais geradas — anotados os 5 valores essenciais: região, endpoint, nome do registry, usuário e senha. Detalhe importante: o nome do registry é global na plataforma e faz parte do caminho da imagem (host/REGISTRY/imagem:tag).\n2. Repositório novo no GitHub, clonado e validado com git remote -v.\n3. Aplicação Flask mínima com dois endpoints: / (identifica app e versão) e /health (health check — padrão que orquestradores e load balancers usam pra decidir se uma instância recebe tráfego).\n4. Build e validação local ANTES da pipeline — erro de Dockerfile é muito mais rápido de diagnosticar na máquina do que lendo log de execução remota. Pipeline é etapa de confirmação, não ambiente de depuração.\n5. Credenciais guardadas como GitHub Secrets — valores criptografados que o workflow acessa em tempo de execução mas nunca aparecem em log. Dos 5 valores anotados, só 2 são segredo (usuário e senha); os outros 3 são endereçamento e vão em texto plano no workflow. Regra de bolso: sensível → Secret; endereço → env.\n6. Workflow publish.yml: checkout → endereço da imagem → Buildx → metadata-action (tags latest + hash curto do commit) → validação de credenciais → login → build e push → summary com digest.\n7-9. Push, acompanhamento na aba Actions e validação no console da Magalu comparando o digest do Summary com o do registry.\n10. Desafio final: nova versão da aplicação, novo push, nova tag e novo digest — ciclo completo comprovado.\n\nOS TROPEÇOS (onde mais se aprende)\n- git add . executado de DENTRO da subpasta do projeto — os 4 arquivos da aplicação subiram, mas a pasta .github/ (que morava um nível acima) ficou de fora do commit. Resultado: push sem workflow nenhum, e o GitHub exibindo a tela de boas-vindas do Actions como se nada existisse. O git status tinha dedurado o tempo todo ('Arquivos não monitorados: ../.github/'). Lição batida e re-aprendida: git status antes de todo commit, lendo até o final.\n- BUG NO MATERIAL: o step de validação de credenciais da apostila usa o padrão [ -z \"$VAR\" ] && { echo erro; exit 1; } — e a última linha do script é exatamente um teste desses. Quando os secrets EXISTEM, o teste retorna falso (exit code 1), o && curto-circuita, e esse exit code 1 vira o resultado do step inteiro. Ou seja: o script falha justamente quando as credenciais estão corretas. Diagnóstico pelo log: U=\"***\" e P=\"***\" mascarados (valores presentes!), nenhuma mensagem de 'ausente' impressa, e 'Process completed with exit code 1' seco no final. Correção: trocar o padrão && por blocos if/then explícitos com um echo de sucesso no final. Bug reportado ao professor no Classroom com link do repositório.\n\nO CLÍMAX\nSegundo push: pipeline verde em 42 segundos, 14 steps, imagem publicada. E ao testar uma segunda versão da aplicação, o console da Magalu mostrou o registro completo: duas imagens no repositório, cada uma com sua tag de hash do commit, digests distintos, e a tag latest apontando pra mais nova. Cada push vira uma versão rastreável, auditável e imutável — sem nenhum comando manual de build, tag ou push. A esteira do slide funcionando no meu terminal.\n\nCONCEITOS CONSOLIDADOS\n- Tag vs Digest: tag é apelido reatribuível (latest muda de dono a cada push); digest é impressão digital sha256 imutável. Em produção, rastreabilidade de verdade usa digest.\n- Endereço de imagem na Magalu: sempre host/NOME_DO_REGISTRY/imagem:tag — omitir o nome do registry no meio do caminho é a causa clássica de 'denied' no push.\n- Secrets vs env: credencial nunca no YAML nem no código; endereço e configuração podem ser públicos porque não abrem porta nenhuma sem a chave.\n- Validar local antes da pipeline: a esteira confirma, não depura.\n- Shell script traiçoeiro: teste condicional com && como última linha de script propaga exit code inesperado — padrão if/then é mais verboso e mais seguro.\n- Material didático também tem bug — segundo que encontro no curso. Validar na prática continua sendo a regra, não a exceção.",
        tags: ["ci", "github actions", "container registry", "docker", "pipeline", "secrets", "digest", "troubleshooting", "magalu cloud", "devops", "movetech"]

        title: "Kubernetes na raiz — subindo um cluster K3s do zero na Magalu Cloud",
        content:
          "CONTEXTO\nAté agora, todo o meu contato com Kubernetes tinha sido pelo lado confortável: o MKE (Magalu Kubernetes Engine), o serviço gerenciado onde o control plane já vem pronto e você só manda os manifests. Funciona muito bem, mas esconde tudo que acontece por baixo. Na aula de hoje o Gilmar fez diferente: em vez do gerenciado, mandou a turma subir um cluster do zero com K3s numa VM crua. Pela primeira vez eu vi o que existe embaixo do kubectl — e mudou minha compreensão da ferramenta.\n\nMKE vs. self-managed: por que importa\nNo cluster gerenciado, a Magalu monta e opera o control plane, entrega o kubeconfig pronto e cuida da disponibilidade. Ótimo para produção. Mas para APRENDER — e para a CKA — o caminho é o oposto: você instala o control plane, configura o acesso na mão e sente cada engrenagem. A prova da CKA, aliás, não usa cluster gerenciado: te dá VMs cruas e você monta tudo. Essa aula foi meu primeiro contato com o tipo de Kubernetes que a certificação cobra.\n\nO CAMINHO\n1. Provisionei uma VM na Magalu (Ubuntu 24.04). Detalhe de campo: a região que eu queria estava sem capacidade de IPv4 público no momento, então subi em outra região — problema real de nuvem, resolvido na hora trocando de zona.\n2. Instalei o K3s com um único comando (curl da get.k3s.io). Em segundos ele já criou o binário kubectl, o crictl e subiu como serviço do systemd.\n3. Apliquei três objetos que trabalham juntos: um ConfigMap (com o HTML da página), um Deployment (2 réplicas de nginx) e um Service NodePort (expondo na porta 30080).\n\nOS TROPEÇOS (onde mais se aprende)\n- kubectl: permission denied — o kubectl tentava ler o kubeconfig do caminho original do K3s, protegido para root. A correção foi apontar a variável de ambiente KUBECONFIG para a cópia no meu home. Esse errinho é clássico de troubleshooting da CKA: 'por que o kubectl não conecta?' quase sempre é a KUBECONFIG apontando para o lugar errado.\n- Security Group sem a porta certa — a página não abria no navegador porque o firewall só liberava SSH. Precisei criar uma regra de ingress para a porta do NodePort. E aqui o velho hábito salvou: o comando falhou pedindo um parâmetro obrigatório (o ethertype), e o --help me mostrou a sintaxe exata na hora. Documentação envelhece; --help nunca mente.\n\nO CLÍMAX — auto-cura ao vivo\nCom a página no ar (IP_PUBLICO_VM na porta do NodePort), fiz o teste que o próprio HTML sugeria: matei um dos pods na unha (kubectl delete pod). Em segundos, um pod NOVO nasceu sozinho — com nome diferente e idade de poucos segundos — para manter as 2 réplicas que eu havia declarado. E o mais bonito: a página nunca saiu do ar, porque o outro pod atendeu enquanto o Kubernetes recriava o que morreu. Zero downtime, na minha frente. Foi o momento em que o conceito virou mágica.\n\nCONCEITOS CONSOLIDADOS\n- Estado desejado vs. estado real: você declara 'quero 2 pods', e o Kubernetes vigia isso eternamente. Some um, ele repõe. Esse é o coração da coisa.\n- Hierarquia: Deployment gerencia o ReplicaSet, que gerencia os Pods — visível até no nome do pod (app-hashdoReplicaSet-hashdoPod).\n- ConfigMap como volume: o HTML não estava dentro da imagem nginx; foi injetado no pod a partir de um ConfigMap montado como volume. Configuração desacoplada do código. (Numa aplicação real, conteúdo estático iria para Object Storage + CDN ou para dentro da própria imagem; ConfigMap com HTML é ótimo para demonstrar o mecanismo, mas tem limite de tamanho e não é o lugar de conteúdo em produção.)\n- NodePort: a forma mais simples de expor um Service para fora do cluster, abrindo uma porta em cada nó.\n- Gerenciado vs. self-managed: MKE para produção (a Magalu cuida da disponibilidade); K3s/self-managed para aprender e controlar cada camada — e para treinar no formato da CKA.\n\nPor que essa aula foi diferente das outras\nNão foi só 'mais um lab de Kubernetes'. Foi a primeira vez que montei o cluster em vez de consumir um pronto. Saí da aula entendendo o que o kubectl fala com o control plane, por que o kubeconfig importa, e como uma requisição atravessa NodePort → Service → Pod → nginx → ConfigMap. É esse tipo de compreensão que separa quem usa Kubernetes de quem opera Kubernetes.",
        tags: ["kubernetes", "k3s", "magalu cloud", "cka", "self-managed", "troubleshooting", "devops", "movetech"]
      },

          "Contribuição pra issue #17 do repositório de turma (Sprint de Inovação — Magalu Cloud), atuando como Engenharia, não Dev.\n\nDECISÃO DE ESCOPO\nA issue permitia código, automação ou documentação. Optei por entregar o desenho do fluxo — um documento de arquitetura pro time de implementação seguir — em vez de um protótipo funcional. Faz mais sentido pro papel de Engenharia do que sair codando uma tela.\n\nPROBLEMA IDENTIFICADO\nHoje criar VPC, Subnet e Security Group na Magalu Cloud só é possível via CLI (mgc). Não existe um fluxo visual guiado no console que amarre a ordem obrigatória (VPC → Subnet → SG → Regra) nem avise que subnet não existe sem VPC criada antes.\n\nPROPOSTA\nWizard de 4 etapas sequenciais, cada uma só libera a próxima quando o recurso anterior existe:\n1. VPC\n2. Subnets (pública e privada)\n3. Grupo de segurança — opção de criar novo ou reaproveitar existente; se novo, escolhe o SO da instância (Linux/Windows) e o wizard já libera a porta administrativa certa (22 ou 3389) restrita ao IP de quem está criando, em vez de 0.0.0.0/0\n4. Regras adicionais (opcional)\n\nDOCUMENTO ENTREGUE\nDiagrama de fluxo em mermaid (renderiza direto no GitHub), mapeamento de cada etapa pro comando mgc correspondente, estados de erro a cobrir (CIDR sobreposto, VPC ainda em processing, grupo existente sem regra de acesso) e notas de segurança.\n\nGIT E GITHUB\nBranch feature/add-design-vpc criada a partir da developer atualizada. Commit único com o arquivo desafios/add-design-vpc.md. PR #60 aberta contra developer, com descrição estruturada (o que é / problema / solução / por que documentação / como revisar).\n\nDESFECHO\nPR #60 mergeada pelo professor Gilmar, com feedback muito positivo — ele comentou que pretende compartilhar o repositório com o próprio time da Magalu Cloud, pra eles verem as ideias dos alunos. Ele também passou um template de descrição de PR usado no mercado (seções: 📝 Descrição, ⚙️ Tipo de Alteração com checkboxes, 🔍 O que mudou, 🧪 Como foi testado, 🔗 Links Relacionados) — referência que vou seguir nos próximos PRs do curso.\n\nCONCEITOS CONSOLIDADOS\nContribuição de documentação é uma entrega válida num fluxo de engenharia real — nem toda issue de melhoria de plataforma exige código, às vezes o valor está em desenhar o problema e a solução pro time certo implementar.\nSegurança por padrão: regra de acesso administrativo restrita ao IP de criação, não a rede inteira, é uma escolha de design que vale documentar explicitamente, não só aplicar.\nDescrição de PR estruturada (tipo de alteração, o que mudou, como foi testado) comunica muito mais profissionalismo do que texto corrido — vale adotar como padrão pessoal daqui pra frente.",
